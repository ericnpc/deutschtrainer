<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0b" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>🥨</text></svg>" />
  <title>B1 Deutsch Trainer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            flag: { red: '#DD0000', gold: '#FFCE00', ink: '#0b0b0b' },
            paper: '#fafaf7',
          },
        },
      },
    };
  </script>
  <style>
    html, body { background: #fafaf7; }
    body { -webkit-tap-highlight-color: transparent; }

    .flag-stripe {
      background: linear-gradient(to right, #0b0b0b 0 33.33%, #DD0000 33.33% 66.66%, #FFCE00 66.66% 100%);
    }

    @keyframes fadeIn        { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes slideUp       { from { opacity:0; transform:translateY(28px); } to { opacity:1; transform:translateY(0); } }
    @keyframes slideRight    { from { opacity:0; transform:translateX(20px); } to { opacity:1; transform:translateX(0); } }
    @keyframes pop           { 0%{transform:scale(.9);opacity:0;} 60%{transform:scale(1.04);opacity:1;} 100%{transform:scale(1);} }
    @keyframes shake         { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }
    @keyframes streakPulse   { 0%,100%{transform:scale(1);} 50%{transform:scale(1.15);} }
    @keyframes summaryIn     { 0%{opacity:0;transform:translateY(40px) scale(.94);} 100%{opacity:1;transform:translateY(0) scale(1);} }
    @keyframes flashIn       { 0%{opacity:0;} 40%{opacity:1;} 100%{opacity:0;} }
    @keyframes toastIn       { from{opacity:0;transform:translate(-50%,12px);} to{opacity:1;transform:translate(-50%,0);} }
    @keyframes drop          { 0%{transform:translateY(-6px);} 60%{transform:translateY(2px);} 100%{transform:translateY(0);} }
    @keyframes greenPulse    { 0%{box-shadow:0 0 0 0 rgba(34,197,94,.5);} 70%{box-shadow:0 0 0 8px rgba(34,197,94,0);} 100%{box-shadow:0 0 0 0 rgba(34,197,94,0);} }
    @keyframes redShake      { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-3px);} 75%{transform:translateX(3px);} }
    @keyframes hintSlide     { from { opacity:0; transform:translateY(-8px); max-height:0; } to { opacity:1; transform:translateY(0); max-height:240px; } }
    @keyframes dirSlideRight { 0%,100%{transform:translateX(0);} 50%{transform:translateX(4px);} }
    @keyframes dirSlideLeft  { 0%,100%{transform:translateX(0);} 50%{transform:translateX(-4px);} }
    @keyframes dirPulse      { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }
    @keyframes clusterPulse  { 0%,100%{background-color:transparent;} 30%,70%{background-color:rgba(255,206,0,.35);} }

    .anim-in       { animation: fadeIn .22s ease-out; }
    .anim-slideup  { animation: slideUp .28s cubic-bezier(.2,.9,.3,1.2); }
    .anim-slide    { animation: slideRight .25s ease-out; }
    .anim-pop      { animation: pop .28s ease-out; }
    .anim-shake    { animation: shake .3s; }
    .anim-streak   { animation: streakPulse .35s ease-out; }
    .anim-summary  { animation: summaryIn .42s cubic-bezier(.2,.9,.3,1.2); }
    .anim-flash    { animation: flashIn .25s ease-out; }
    .anim-toast    { animation: toastIn .22s ease-out; }
    .anim-drop     { animation: drop .22s ease-out; }
    .anim-hint     { animation: hintSlide .3s ease-out; overflow: hidden; }
    .anim-cluster  { animation: clusterPulse 1.1s ease-out; }
    .dir-wo        { animation: dirPulse 1.6s ease-in-out infinite; display:inline-block; }
    .dir-wohin     { animation: dirSlideRight 1.6s ease-in-out infinite; display:inline-block; }
    .dir-woher     { animation: dirSlideLeft 1.6s ease-in-out infinite; display:inline-block; }

    .progress-bar { transition: width .35s cubic-bezier(.4,0,.2,1); }

    button, input, select, textarea { -webkit-appearance: none; appearance: none; }
    button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
      outline: 3px solid #FFCE00; outline-offset: 2px;
    }

    /* Article pill */
    .pill {
      display: inline-flex; align-items: center; justify-content: center;
      padding: .85rem 1rem; border-radius: 9999px;
      border: 2px solid #e5e5e5; background: white;
      font-weight: 600; font-size: 1.05rem; min-width: 4.25rem;
      transition: all .12s ease; cursor: pointer;
    }
    .pill:hover { border-color: #d4d4d4; }
    .pill.active-der { background: #0b0b0b; color: #fff; border-color: #0b0b0b; }
    .pill.active-die { background: #DD0000; color: #fff; border-color: #DD0000; }
    .pill.active-das { background: #FFCE00; color: #0b0b0b; border-color: #FFCE00; }

    .article-tag-der { background: #0b0b0b; color: #fff; }
    .article-tag-die { background: #DD0000; color: #fff; }
    .article-tag-das { background: #FFCE00; color: #0b0b0b; }

    /* Token chips for Nebensatz */
    .token-chip {
      display: inline-flex; align-items: center; justify-content: center;
      padding: .55rem .85rem; border-radius: .75rem;
      background: white; border: 2px solid #e5e5e5;
      font-weight: 600; font-size: 1rem;
      cursor: grab; user-select: none;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease, background .15s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .token-chip:hover { border-color: #cbd5e1; box-shadow: 0 4px 8px rgba(0,0,0,.06); transform: translateY(-1px); }
    .token-chip:active { cursor: grabbing; transform: scale(.97); }
    .token-ghost  { opacity: .35; transform: rotate(2deg); }
    .token-drag   { transform: rotate(-2deg) scale(1.05); box-shadow: 0 8px 16px rgba(0,0,0,.18) !important; border-color: #FFCE00 !important; }
    .token-wrong  { background: #fee2e2; border-color: #ef4444; color: #991b1b; }
    .token-right  { background: #dcfce7; border-color: #22c55e; color: #166534; }

    .build-slot {
      min-height: 3.4rem;
      border: 2px dashed #d4d4d4;
      border-radius: 1rem;
      background: #fafaf7;
      padding: .55rem;
      display: flex; flex-wrap: wrap; gap: .5rem;
      align-items: center;
      transition: border-color .15s ease, background .15s ease;
    }
    .pool-slot {
      min-height: 2.4rem;
      display: flex; flex-wrap: wrap; gap: .5rem;
      padding: .25rem 0;
    }

    /* Fill-in inline inputs (Konjunktiv, Adjective, Praep, VerbPraep, ModalPerfekt, Relativ) */
    .fill-input {
      display: inline-block; vertical-align: baseline;
      padding: .25rem .5rem; margin: 0 .15rem;
      border: none; border-bottom: 2px solid #0b0b0b;
      background: rgba(255,206,0,.18);
      border-radius: .35rem .35rem 0 0;
      font-weight: 600; font-size: 1.05rem; line-height: 1.5;
      transition: background .15s ease, border-color .15s ease;
    }
    .fill-input:focus { background: rgba(255,206,0,.35); border-bottom-color: #DD0000; outline: none; }
    .fill-input.right { background: #dcfce7; border-bottom-color: #22c55e; color: #166534; animation: greenPulse .8s ease-out; }
    .fill-input.wrong { background: #fee2e2; border-bottom-color: #ef4444; color: #991b1b; animation: redShake .3s; }

    /* haben/sein big buttons */
    .hs-btn {
      flex: 1; padding: 1.1rem 1rem;
      border: 3px solid #0b0b0b; border-radius: 1rem;
      background: white; font-weight: 800; font-size: 1.45rem;
      transition: all .12s ease;
      position: relative;
    }
    .hs-btn:hover { background: #f5f5f0; transform: translateY(-1px); }
    .hs-btn .kbd {
      position: absolute; top: .35rem; right: .55rem;
      font-size: .65rem; font-weight: 700; color: #999;
    }
    .hs-btn.flash-correct { background: #dcfce7; border-color: #22c55e; color: #166534; }
    .hs-btn.flash-wrong   { background: #fee2e2; border-color: #ef4444; color: #991b1b; }

    /* Direction badges (PraepLokal) */
    .dir-badge {
      display: inline-block; font-weight: 700; font-size: .7rem;
      padding: .3rem .65rem; border-radius: 9999px; letter-spacing: .04em; text-transform: uppercase;
    }
    .dir-badge.wo    { background: #dbeafe; color: #1e40af; }
    .dir-badge.wohin { background: #d1fae5; color: #065f46; }
    .dir-badge.woher { background: #ede9fe; color: #5b21b6; }

    /* Verb chip (VerbPraep) */
    .verb-chip {
      display: inline-block; font-weight: 700; font-size: .9rem;
      padding: .35rem .75rem; border-radius: 9999px;
      background: #f3e8ff; color: #6b21a8; letter-spacing: .01em;
    }

    /* Sentence box for Relativsätze */
    .sent-box {
      background: white; border: 1.5px solid #e5e7eb; border-radius: .75rem;
      padding: .65rem .85rem; font-size: .95rem; line-height: 1.5;
    }

    /* Slide-over panel */
    @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
    @keyframes fadeInBg { from { opacity: 0; } to { opacity: 1; } }
    .anim-slidein-right { animation: slideInRight .25s ease-out; }
    .anim-bg-in { animation: fadeInBg .2s ease-out; }

    /* Section disclosure chevron */
    .chevron { display: inline-block; transition: transform .15s ease; }
    .chevron.collapsed { transform: rotate(-90deg); }

    /* Phrase chip (Redemittel) */
    .phrase-chip {
      display: inline-block; padding: .35rem .65rem; margin: .15rem;
      background: #fef3c7; color: #78350f; border: 1px solid #fcd34d;
      border-radius: .5rem; font-size: .85rem; cursor: pointer;
      transition: all .12s ease; line-height: 1.35;
    }
    .phrase-chip:hover { background: #fde68a; transform: translateY(-1px); }
    .phrase-chip:active { transform: scale(.97); }

    /* Editor textarea */
    .editor-textarea {
      width: 100%; min-height: 16rem;
      padding: .9rem 1rem; border-radius: 1rem;
      border: 2px solid #e5e7eb; background: white;
      font-size: 1rem; line-height: 1.6; resize: vertical;
      transition: border-color .15s, background-color .3s;
    }
    .editor-textarea:focus { border-color: #0b0b0b; outline: none; }
    .editor-textarea.flash { background-color: #fef3c7; }

    /* Reference table cells */
    .ref-cell { padding: .5rem .75rem; vertical-align: top; }

    /* Page transitions (hub ↔ section) */
    @keyframes pageInRight { from { transform: translateX(28px); opacity:0; } to { transform: translateX(0); opacity:1; } }
    @keyframes pageInLeft  { from { transform: translateX(-28px); opacity:0; } to { transform: translateX(0); opacity:1; } }
    .anim-page-fwd  { animation: pageInRight .25s ease-out; }
    .anim-page-back { animation: pageInLeft  .25s ease-out; }

    /* Hub card hover */
    .hub-card { transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
    .hub-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.06); }

    /* Declension matrix cell */
    .decl-row { transition: background-color .15s ease; }
    .decl-cell { transition: transform .15s ease, box-shadow .15s ease; }
    .decl-cell:hover { box-shadow: 0 6px 14px rgba(0,0,0,.06); }
    .decl-pat-def  { background:#dbeafe; color:#1e3a8a; }
    .decl-pat-zero { background:#fef3c7; color:#78350f; }
    .decl-pat-ein  { background:#ede9fe; color:#5b21b6; }
    .decl-pat-def-soft  { background:#eff6ff; }
    .decl-pat-zero-soft { background:#fffbeb; }
    .decl-pat-ein-soft  { background:#f5f3ff; }

    /* Vorlesen view */
    .vorlesen-text {
      font-size: 1.5rem; line-height: 1.8; color: #f5f5f0;
      max-width: 38rem; margin: 0 auto; white-space: pre-wrap;
      font-family: ui-serif, Georgia, serif;
    }
  </style>
</head>
<body class="font-sans text-flag-ink">
  <div class="flag-stripe h-1.5 w-full"></div>

  <div id="app" class="max-w-2xl mx-auto px-4 pb-24"></div>

  <div id="toast-host" class="fixed left-1/2 bottom-6 z-50 pointer-events-none"></div>
  <div id="flash-host" class="fixed inset-0 pointer-events-none z-40"></div>

  <script src="vocab_data.js"></script>
  <script src="nebensatz_data.js"></script>
  <script src="habensein_data.js"></script>
  <script src="konjunktiv_data.js"></script>
  <script src="adjective_data.js"></script>
  <script src="praeposition_lokal_data.js"></script>
  <script src="verb_praep_data.js"></script>
  <script src="modal_perfekt_data.js"></script>
  <script src="relativ_data.js"></script>
  <script src="verb_position_ref.js"></script>
  <script src="article_patterns_ref.js"></script>
  <script src="declension_ref.js"></script>
  <script src="schreiben_redemittel.js"></script>
  <script src="sprechen_redemittel.js"></script>
  <script>
  // ============================================================
  //  Storage
  // ============================================================
  const STATE_KEY = 'b1trainer_state';
  const LEGACY_VOCAB_KEY = 'b1trainer_progress';
  const SESSION_SIZE = 15;
  const REVIEW_SIZE  = 20;
  const BLITZ_SIZE   = 30;
  const BLITZ_TIME   = 90 * 1000;
  const MATURE_DAYS  = 21;

  function emptyState() {
    return {
      vocab:{}, nebensatz:{}, habenSein:{}, konjunktiv:{},
      adjective:{}, praepLokal:{}, verbPraep:{}, modalPerfekt:{}, relativ:{},
      schreiben_drafts: { informal:null, formal:null, forum:null },
      schreiben_vorlagen: { informal:[], formal:[], forum:[] },
      sprechen_drafts: { planning:null, presentation:null },
      sprechen_vorlagen: { planning:[], presentation:[] },
      ui_prefs: { last_section: null, last_section_timestamp: 0 },
      meta:{ lastSessionDate:null, streak:0, vorlagenSeeded:false },
    };
  }

  function migrate() {
    const raw = localStorage.getItem(STATE_KEY);
    if (raw) {
      // ensure new buckets present
      try {
        const p = JSON.parse(raw);
        const fresh = emptyState();
        let changed = false;
        Object.keys(fresh).forEach(k => {
          if (!p[k]) { p[k] = fresh[k]; changed = true; }
        });
        if (changed) localStorage.setItem(STATE_KEY, JSON.stringify(p));
      } catch {}
      return;
    }
    let vocab = {};
    const old = localStorage.getItem(LEGACY_VOCAB_KEY);
    if (old) {
      try {
        const parsed = JSON.parse(old);
        if (parsed && typeof parsed === 'object') vocab = parsed;
      } catch {}
    }
    const fresh = emptyState();
    fresh.vocab = vocab;
    localStorage.setItem(STATE_KEY, JSON.stringify(fresh));
  }

  function loadState() {
    try {
      const p = JSON.parse(localStorage.getItem(STATE_KEY) || '{}');
      const base = emptyState();
      return { ...base, ...p, meta: { ...base.meta, ...(p.meta || {}) } };
    } catch { return emptyState(); }
  }
  function saveState(s) { localStorage.setItem(STATE_KEY, JSON.stringify(s)); }

  function defaultCardState() { return { interval:0, ease:2.5, due:0, reps:0, lapses:0 }; }
  function getItemState(type, key) {
    const s = loadState();
    return (s[type] || {})[key] || defaultCardState();
  }
  function setItemState(type, key, st) {
    const s = loadState();
    if (!s[type]) s[type] = {};
    s[type][key] = st;
    saveState(s);
  }
  function getMeta() { return loadState().meta; }
  function setMeta(m) { const s = loadState(); s.meta = m; saveState(s); }
  function clearAllProgress() {
    localStorage.removeItem(STATE_KEY);
    localStorage.removeItem(LEGACY_VOCAB_KEY);
    migrate();
    seedSampleVorlagen();
  }

  // ---- UI prefs (last-visited section + timestamp) ----
  function getUIPrefs() { return loadState().ui_prefs || { last_section: null, last_section_timestamp: 0 }; }
  function setUIPrefs(p) { const s = loadState(); s.ui_prefs = p; saveState(s); }
  const LAST_SECTION_TTL = 30 * 60 * 1000;
  const SECTION_VIEWS = ['hub','section-vokabeln','section-grammatik','section-editors','section-referenz'];
  function isSectionView(v) { return SECTION_VIEWS.includes(v); }
  function recordLastSection(view) {
    if (!isSectionView(view)) return;
    const p = getUIPrefs();
    p.last_section = view;
    p.last_section_timestamp = Date.now();
    setUIPrefs(p);
  }
  function bootView() {
    const p = getUIPrefs();
    const ts = p.last_section_timestamp || 0;
    if (p.last_section && isSectionView(p.last_section) && (Date.now() - ts) < LAST_SECTION_TTL) {
      return p.last_section;
    }
    return 'hub';
  }

  // ---- Editor drafts ----
  function getDraft(area, taskId) {
    const s = loadState();
    const bucket = area === 'schreiben' ? s.schreiben_drafts : s.sprechen_drafts;
    return (bucket && bucket[taskId]) || null;
  }
  function setDraft(area, taskId, data) {
    const s = loadState();
    const bucketKey = area === 'schreiben' ? 'schreiben_drafts' : 'sprechen_drafts';
    if (!s[bucketKey]) s[bucketKey] = {};
    s[bucketKey][taskId] = { ...data, lastSaved: Date.now() };
    saveState(s);
  }

  // ---- Vorlagen ----
  function listVorlagen(area, taskId) {
    const s = loadState();
    const bucketKey = area === 'schreiben' ? 'schreiben_vorlagen' : 'sprechen_vorlagen';
    return (s[bucketKey] && s[bucketKey][taskId]) || [];
  }
  function saveVorlage(area, taskId, vorlage) {
    const s = loadState();
    const bucketKey = area === 'schreiben' ? 'schreiben_vorlagen' : 'sprechen_vorlagen';
    if (!s[bucketKey]) s[bucketKey] = {};
    if (!s[bucketKey][taskId]) s[bucketKey][taskId] = [];
    const id = vorlage.id || ('v_' + Date.now() + '_' + Math.random().toString(36).slice(2,7));
    const entry = { id, name: vorlage.name, body: vorlage.body, savedAt: Date.now(), isExample: !!vorlage.isExample };
    s[bucketKey][taskId].push(entry);
    saveState(s);
    return entry;
  }
  function deleteVorlage(area, taskId, id) {
    const s = loadState();
    const bucketKey = area === 'schreiben' ? 'schreiben_vorlagen' : 'sprechen_vorlagen';
    const arr = (s[bucketKey] && s[bucketKey][taskId]) || [];
    s[bucketKey][taskId] = arr.filter(v => v.id !== id || v.isExample);
    saveState(s);
  }

  // ---- Sample Vorlagen seeding ----
  const SAMPLE_VORLAGEN = {
    schreiben: {
      informal: {
        name: 'Beispiel: Antwort auf Geburtstagseinladung',
        body: `Liebe Maria,

vielen Dank für die Einladung zu deinem Geburtstag! Ich freue mich sehr, dass du an mich gedacht hast.

Leider kann ich am Samstag nicht kommen, weil ich an diesem Wochenende nach Hamburg fahre. Meine Schwester gibt dort ein Konzert und ich habe ihr versprochen, sie zu besuchen. Es tut mir wirklich leid!

Aber ich würde dich gern ein anderes Mal sehen. Hast du Lust auf ein Treffen am Mittwoch nach der Arbeit? Wir könnten zusammen Pizza essen, und ich bringe dir dann auch dein Geschenk mit.

Schreib mir bitte, ob das für dich passt.

Liebe Grüße,
Eric`,
      },
      formal: {
        name: 'Beispiel: Anfrage zu einem Sprachkurs',
        body: `Sehr geehrte Damen und Herren,

mit großem Interesse habe ich Ihre Anzeige für den Deutschkurs B2 gelesen. Ich schreibe Ihnen, weil ich mich für den Kurs anmelden möchte.

Ich lerne seit einem Jahr Deutsch und möchte meine Kenntnisse weiter verbessern, denn ich plane, in Deutschland zu studieren.

Ich würde gerne wissen, wann der Kurs beginnt und wie viel er kostet. Außerdem bitte ich Sie, mir den genauen Stundenplan zu schicken. Wäre es auch möglich, einen Probetag zu vereinbaren?

Über eine baldige Rückmeldung würde ich mich sehr freuen.

Mit freundlichen Grüßen,
Eric Pintos`,
      },
      forum: {
        name: 'Beispiel: Smartphones in der Schule',
        body: `Über das Thema Smartphones in der Schule wird heutzutage viel diskutiert. Meiner Meinung nach sollten Schüler Smartphones in der Schule nutzen dürfen, aber nur unter klaren Regeln.

Auf der einen Seite sind Smartphones nützlich, weil man schnell Informationen finden kann. Außerdem können Schüler in der Pause mit ihren Eltern Kontakt halten. Ein weiterer Vorteil ist, dass viele Apps beim Lernen helfen.

Auf der anderen Seite gibt es auch Nachteile. Smartphones lenken oft vom Unterricht ab, und manche Schüler benutzen sie für soziale Medien statt für die Schule. Allerdings denke ich, dass das eher eine Frage der Disziplin ist.

Zusammenfassend bin ich der Meinung, dass Smartphones im Unterricht erlaubt sein sollten, aber nur für schulische Zwecke.`,
      },
    },
    sprechen: {
      planning: {
        name: 'Beispiel: Kinobesuch planen',
        body: `Szenario: Sie wollen mit Ihrem Freund ins Kino gehen.

A: Hallo! Hast du Lust, am Wochenende mit mir ins Kino zu gehen?
B: Das ist eine super Idee! Welchen Film möchtest du denn sehen?
A: Es läuft ein neuer Krimi am Freitag. Wie wäre es mit der 19-Uhr-Vorstellung?
B: Freitag um 19 Uhr passt mir leider nicht, weil ich noch arbeite. Hättest du am Samstag Zeit?
A: Samstag passt mir auch sehr gut. Wie sieht es um 17 Uhr aus?
B: Perfekt! Wo treffen wir uns?
A: Direkt vor dem Kino am Hauptbahnhof, fünf Minuten vor Beginn.
B: Einverstanden. Soll ich die Tickets schon online kaufen?
A: Ja gern, das wäre super. Ich überweise dir das Geld dann.
B: Alles klar, dann sehen wir uns am Samstag um 16:55!
A: Bis Samstag, ich freue mich!`,
      },
      presentation: {
        name: 'Beispiel: Soziale Medien im Alltag',
        body: 'PRESENTATION_PLACEHOLDER', // we'll store slides separately
        slides: [
          'In meiner Präsentation werde ich heute über soziale Medien im Alltag sprechen. Zuerst werde ich meine eigenen Erfahrungen besprechen, dann über die Situation in meinem Heimatland berichten. Danach werde ich Vor- und Nachteile analysieren, und schließlich werde ich meine Meinung dazu sagen.',

  function seedSampleVorlagen() {

  // ============================================================
  //  SR (SM-2 lite)
  // ============================================================
  function applyGrade(state, grade) {
    const s = { ...state };
    if (grade === 'wrong') {
      s.interval = 0; s.ease = Math.max(1.3, s.ease - 0.2); s.lapses += 1;
    } else if (grade === 'wrong-hard') {
      s.interval = 0; s.ease = Math.max(1.3, s.ease - 0.25); s.lapses += 1;
    } else if (grade === 'partial') {
      s.interval = Math.max(1, Math.floor(s.interval * 0.5));
      s.ease = Math.max(1.3, s.ease - 0.15);
    } else if (grade === 'partial-konj') {
      s.interval = Math.max(1, Math.floor(s.interval * 0.4));
      s.ease = Math.max(1.3, s.ease - 0.15);
    } else if (grade === 'partial-modal') {
      s.interval = Math.max(1, Math.floor(s.interval * 0.3));
      s.ease = Math.max(1.3, s.ease - 0.2);
      s.lapses += 1;
    } else if (grade === 'correct') {
      if (s.reps === 0) s.interval = 1;
      else if (s.reps === 1) s.interval = 3;
      else s.interval = Math.round(s.interval * s.ease);
    } else if (grade === 'easy') {
      let base;
      if (s.reps === 0) base = 1;
      else if (s.reps === 1) base = 3;
      else base = Math.round(s.interval * s.ease);
      s.interval = Math.max(1, Math.round(base * 1.3));
    }
    s.ease = Math.min(2.8, Math.max(1.3, s.ease));
    s.reps += 1;
    s.due = s.interval === 0 ? 0 : Date.now() + s.interval * 86400000;
    return s;
  }
  function isDue(state) { return state.reps === 0 || state.due <= Date.now(); }

  // ============================================================
  //  Streak / day tracking
  // ============================================================
  function dateKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function todayStr() { return dateKey(new Date()); }
  function yesterdayStr() {
    const d = new Date(); d.setDate(d.getDate()-1);
    return dateKey(d);
  }
  function recordSessionDay() {
    const meta = getMeta();
    const today = todayStr();
    if (meta.lastSessionDate === today) return;
    if (meta.lastSessionDate === yesterdayStr()) meta.streak = (meta.streak || 0) + 1;
    else meta.streak = 1;
    meta.lastSessionDate = today;
    setMeta(meta);
  }

  // ============================================================
  //  Normalization
  // ============================================================
  function normalize(s) {
    if (s == null) return '';
    return String(s)
      .toLowerCase()
      .trim()
      .replace(/\s+/g, ' ')
      .replace(/…/g, '...')
      .replace(/ae/g, 'ä')
      .replace(/oe/g, 'ö')
      .replace(/ue/g, 'ü')
      .replace(/ss/g, 'ß');
  }
  function stripArticlePrefix(s) {
    return (s || '').replace(/^\s*(der|die|das)\s+/i, '');
  }
  function splitScaffold(s) {
    return String(s || '').split(/_{2,}/);
  }

  // ============================================================
  //  Module configuration
  // ============================================================
  // kind: card.kind / session.type for grammar drills
  // type: localStorage namespace
  const GRAMMAR_MODULES = [
    { kind:'nebensatz',    type:'nebensatz',    label:'Nebensatz',           sub:'Drag verbs to the end of the clause.', accent:'text-flag-red',     btn:'Drill word order',    action:'start-grammar' },
    { kind:'habensein',    type:'habenSein',    label:'haben vs. sein',      sub:'Pick the right Perfekt-auxiliary.',     accent:'text-flag-ink',     btn:'Practice / Blitz',    action:'open-habensein' },
    { kind:'konjunktiv',   type:'konjunktiv',   label:'Konjunktiv II',       sub:'Hätte, wäre, würde + infinitive.',     accent:'text-amber-700',    btn:'Drill wenn-clauses',  action:'start-grammar' },
    { kind:'adjective',    type:'adjective',    label:'Adjektiv-Endungen',   sub:'Tabelle 1 · 2 · gemischt.',            accent:'text-emerald-700',  btn:'Drill endings',       action:'start-grammar' },
    { kind:'praepLokal',   type:'praepLokal',   label:'Präpositionen lokal', sub:'Wo? Wohin? Woher?',                    accent:'text-blue-700',     btn:'Drill prepositions',  action:'start-grammar' },
    { kind:'verbPraep',    type:'verbPraep',    label:'Verb + Präposition',  sub:'denken an, warten auf …',              accent:'text-purple-700',   btn:'Drill pairings',      action:'start-grammar' },
    { kind:'modalPerfekt', type:'modalPerfekt', label:'Modal · Perfekt',     sub:'Doppelinfinitiv-Pattern.',             accent:'text-rose-700',     btn:'Drill double-inf',    action:'start-grammar' },
    { kind:'relativ',      type:'relativ',      label:'Relativsätze',        sub:'der/die/das · dessen/deren.',          accent:'text-indigo-700',   btn:'Drill rel. pronouns', action:'start-grammar' },
  ];
  function moduleByKind(kind) { return GRAMMAR_MODULES.find(m => m.kind === kind); }
  function moduleItems(kind) {
    switch (kind) {
      case 'nebensatz':    return NEBENSATZ_ITEMS;
      case 'habensein':    return HABEN_SEIN_ITEMS;
      case 'konjunktiv':   return KONJUNKTIV_ITEMS;
      case 'adjective':    return ADJECTIVE_ITEMS;
      case 'praepLokal':   return PRAEPOSITION_LOKAL_ITEMS;
      case 'verbPraep':    return VERB_PRAEP_ITEMS;
      case 'modalPerfekt': return MODAL_PERFEKT_ITEMS;
      case 'relativ':      return RELATIV_ITEMS;
      default: return [];
    }
  }
  function kindToType(kind) {
    if (kind === 'habensein') return 'habenSein';
    return kind;
  }
  function itemKey(kind, item) {
    return kind === 'vocab' ? item.german : item.id;
  }

  const SUBJECT_FORMS = {
    'ich':       ['habe', 'bin'],
    'du':        ['hast', 'bist'],
    'er/sie/es': ['hat', 'ist'],
    'wir':       ['haben', 'sind'],
    'ihr':       ['habt', 'seid'],
    'sie/Sie':   ['haben', 'sind'],
  };
  // Sanity-check habensein answers map to forms
  HABEN_SEIN_ITEMS.forEach(it => {
    const f = SUBJECT_FORMS[it.subject_form];
    if (!f || !f.includes(it.answer)) console.warn('habensein answer mismatch', it.id);
  });

  // ============================================================
  //  Stats helpers
  // ============================================================
  function moduleStats(type, items, keyFn) {
    keyFn = keyFn || ((it) => it.id);
    const total = items.length;
    let seen = 0, due = 0, totalReps = 0, totalLapses = 0, strengthSum = 0;
    items.forEach(it => {
      const s = getItemState(type, keyFn(it));
      if (s.reps > 0) seen++;
      if (s.reps > 0 && s.due <= Date.now()) due++;
      totalReps   += s.reps;
      totalLapses += s.lapses;
      strengthSum += Math.min(s.interval / MATURE_DAYS, 1);
    });
    return {
      total, seen, due,
      seenPct: total ? Math.round(seen / total * 100) : 0,
      strength: total ? Math.round(strengthSum / total * 100) : 0,
      accuracy: totalReps > 0 ? Math.round((totalReps - totalLapses) / totalReps * 100) : null,
    };
  }
  function vocabLessonStats(lesson) {
    return moduleStats('vocab', lesson.words, (w) => w.german);
  }
  function totalDueCount() {
    let n = 0;
    LESSONS.forEach(l => l.words.forEach(w => {
      const s = getItemState('vocab', w.german);
      if (s.reps > 0 && s.due <= Date.now()) n++;
    }));
    GRAMMAR_MODULES.forEach(m => {
      moduleItems(m.kind).forEach(it => {
        const s = getItemState(m.type, it.id);
        if (s.reps > 0 && s.due <= Date.now()) n++;
      });
    });
    return n;
  }
  function totalSeenCount() {
    let n = 0;
    LESSONS.forEach(l => l.words.forEach(w => { if (getItemState('vocab', w.german).reps > 0) n++; }));
    GRAMMAR_MODULES.forEach(m => {
      moduleItems(m.kind).forEach(it => { if (getItemState(m.type, it.id).reps > 0) n++; });
    });
    return n;
  }

  // ============================================================
  //  Selection
  // ============================================================
  function pickVocabSession(lesson, size = SESSION_SIZE) {
    const cards = lesson.words.map(w => ({ kind:'vocab', item:w, lesson, state:getItemState('vocab', w.german) }));
    const news = cards.filter(c => c.state.reps === 0);
    const due  = cards.filter(c => c.state.reps > 0 && c.state.due <= Date.now()).sort((a,b) => a.state.due - b.state.due);
    const fut  = cards.filter(c => c.state.reps > 0 && c.state.due >  Date.now()).sort((a,b) => a.state.due - b.state.due);
    return [...news, ...due, ...fut].slice(0, size);
  }
  function pickGrammarSession(kind, size = SESSION_SIZE) {
    const m = moduleByKind(kind);
    const items = moduleItems(kind);
    const cards = items.map(it => ({ kind, item:it, state:getItemState(m.type, it.id) }));
    const news = cards.filter(c => c.state.reps === 0);
    const due  = cards.filter(c => c.state.reps > 0 && c.state.due <= Date.now()).sort((a,b) => a.state.due - b.state.due);
    const fut  = cards.filter(c => c.state.reps > 0 && c.state.due >  Date.now()).sort((a,b) => a.state.due - b.state.due);
    return [...news, ...due, ...fut].slice(0, size);
  }
  function pickMixedReview(size = REVIEW_SIZE) {
    const cards = [];
    LESSONS.forEach(lesson => lesson.words.forEach(w => {
      const st = getItemState('vocab', w.german);
      if (st.reps > 0 && st.due <= Date.now()) cards.push({ kind:'vocab', item:w, lesson, state:st });
    }));
    GRAMMAR_MODULES.forEach(m => {
      moduleItems(m.kind).forEach(it => {
        const st = getItemState(m.type, it.id);
        if (st.reps > 0 && st.due <= Date.now()) cards.push({ kind:m.kind, item:it, state:st });
      });
    });
    cards.sort((a,b) => a.state.due - b.state.due);
    return cards.slice(0, size);
  }
  function dueRemainingForSession(s) {
    if (s.type === 'mixed-review') return Math.max(0, totalDueCount() - s.idx);
    if (s.type === 'vocab-learn' || s.type === 'vocab-drill') {
      const lesson = LESSONS[s.lessonIdx];
      return Math.max(0, lesson.words.length - s.idx);
    }
    if (s.type === 'habensein-blitz') return 0;
    if (s.type === 'habensein-practice') return Math.max(0, HABEN_SEIN_ITEMS.length - s.idx);
    const items = moduleItems(s.type);
    return items.length ? Math.max(0, items.length - s.idx) : 0;
  }

  function escapeHtml(s) {
    return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function articleClass(article) {
    if (article === 'der') return 'article-tag-der';
    if (article === 'die') return 'article-tag-die';
    if (article === 'das') return 'article-tag-das';
    return 'bg-neutral-200 text-neutral-700';

  function showToast(text, ms = 2400) {
    const host = document.getElementById('toast-host');

    const el = document.createElement('div');
    el.className = 'anim-toast pointer-events-auto bg-flag-ink text-white rounded-full px-5 py-3 shadow-lg text-sm font-medium';
    el.textContent = text;
    host.appendChild(el);
    setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; }, ms);

  function renderSectionGrammatik() {

                <div class="h-full bg-flag-ink progress-bar" style="width:${stats.strength}%"></div>

            </div>

        }).join('')}
      </div>
    `;
    return renderSectionHeader('Grammatik', `${GRAMMAR_MODULES.length} Module`)
         + `<main class="${pageAnim()}">${grid}</main>`;

  function renderResetConfirm() {
    return `
      ${renderHeader()}
      <div class="anim-pop mt-10 rounded-2xl bg-white border-2 border-flag-red p-6">
        <div class="text-flag-red font-bold text-lg mb-2">Reset all progress?</div>

  // ============================================================
  //  Renderers — Sessions
  // ============================================================
  function sessionTypeLabel(t) {
    return ({
      'vocab-learn':'Learn','vocab-drill':'Drill','mixed-review':'Mixed Review',
      'nebensatz':'Nebensatz','konjunktiv':'Konjunktiv II',
      'habensein-practice':'haben/sein · Practice','habensein-blitz':'haben/sein · Blitz',
      'adjective':'Adjektiv-Endungen','praepLokal':'Präpositionen lokal',
      'verbPraep':'Verb + Präposition','modalPerfekt':'Modal · Perfekt','relativ':'Relativsätze',
    })[t] || t;
  }

  function renderSessionHeader() {
    const s = state.session;
    const total = s.cards.length;
    const cur = Math.min(s.idx + 1, total);
    const pct = total ? Math.round((s.idx) / total * 100) : 0;
    const streak = s.streak || 0;
    return `
      <header class="pt-5 pb-4">
        <div class="flex items-center gap-3 mb-3">
          <button data-action="exit-session"
                  class="rounded-full w-9 h-9 flex items-center justify-center bg-white border border-neutral-200 hover:bg-neutral-50 transition" aria-label="Exit">
            <span class="text-lg leading-none">←</span>
          </button>
          <div class="flex-1 min-w-0">
            <div class="text-[11px] text-neutral-500 uppercase tracking-wider font-semibold">${sessionTypeLabel(s.type)}</div>
            <div class="text-sm font-semibold truncate">${escapeHtml(s.title)}</div>
          </div>
          ${streak >= 3
            ? `<div class="text-xs font-bold rounded-full bg-flag-gold text-flag-ink px-3 py-1 anim-streak">streak ${streak}</div>`
            : `<div class="text-xs font-medium text-neutral-500">card ${cur} of ${total}</div>`}
        </div>
        <div class="h-1.5 bg-neutral-100 rounded-full overflow-hidden">
          <div class="h-full bg-flag-ink progress-bar" style="width:${pct}%"></div>
        </div>
      </header>
    `;
  }

  function renderSession() {
    const s = state.session;
    if (s.idx >= s.cards.length) return renderSessionEnd();
    const card = s.cards[s.idx];
    let body = '';
    if (s.type === 'vocab-learn')          body = renderVocabLearnCard(card);
    else if (card.kind === 'vocab')        body = renderVocabDrillCard(card);
    else if (card.kind === 'nebensatz')    body = renderNebensatzCard(card);
    else if (card.kind === 'habensein')    body = renderHabenSeinCard(card);
    else if (card.kind === 'konjunktiv')   body = renderKonjunktivCard(card);
    else if (card.kind === 'adjective')    body = renderAdjectiveCard(card);
    else if (card.kind === 'praepLokal')   body = renderPraepLokalCard(card);
    else if (card.kind === 'verbPraep')    body = renderVerbPraepCard(card);
    else if (card.kind === 'modalPerfekt') body = renderModalPerfektCard(card);
    else if (card.kind === 'relativ')      body = renderRelativCard(card);
    return renderSessionHeader() + body;
  }

  function renderSessionEnd() {
    const s = state.session;
    const total = s.cards.length;
    const correct = s.stats.correct;
    const partial = s.stats.partial;
    const wrong   = s.stats.wrong;
    const future  = s.stats.future || 0;
    const pct = total ? Math.round(correct / total * 100) : 0;
    const remaining = dueRemainingForSession(s);
    const canContinue = remaining > 0;

    return renderSessionHeader() + `
      <main class="anim-summary">
        <div class="bg-white rounded-3xl border border-neutral-200 p-7 sm:p-9 shadow-sm text-center">
          <div class="text-xs uppercase tracking-wider text-neutral-400 font-semibold">Session complete</div>
          <div class="mt-2 text-5xl font-extrabold">${correct} / ${total}</div>
          <div class="text-sm text-neutral-500 mt-1">${pct}% correct · ${future} now scheduled for the future</div>
          <div class="grid grid-cols-3 gap-2 mt-6 text-sm">
            <div class="rounded-xl bg-emerald-50 border border-emerald-200 py-3">
              <div class="text-2xl font-bold text-emerald-700">${correct}</div>
              <div class="text-[11px] text-emerald-700 font-semibold uppercase tracking-wider">correct</div>
            </div>
            <div class="rounded-xl bg-amber-50 border border-amber-200 py-3">
              <div class="text-2xl font-bold text-amber-700">${partial}</div>
              <div class="text-[11px] text-amber-700 font-semibold uppercase tracking-wider">partial</div>
            </div>
            <div class="rounded-xl bg-red-50 border border-red-200 py-3">
              <div class="text-2xl font-bold text-red-700">${wrong}</div>
              <div class="text-[11px] text-red-700 font-semibold uppercase tracking-wider">wrong</div>
            </div>
          </div>
          ${canContinue ? `
            <button data-action="session-continue"
                    class="mt-6 w-full py-4 rounded-2xl bg-flag-ink text-white font-bold text-lg hover:bg-neutral-800 transition">
              Continue session (${Math.min(SESSION_SIZE, remaining)} more)
            </button>` : `<div class="mt-6 text-sm text-neutral-500">No more cards to pull in this set. Nice work.</div>`}
          <button data-action="exit-session"
                  class="mt-3 w-full py-3 rounded-2xl bg-white border-2 border-neutral-200 text-flag-ink font-bold hover:bg-neutral-50 transition">
            Back to dashboard
          </button>
        </div>
      </main>
    `;
  }

  // ----------- Vocab Learn card -----------
  function renderVocabLearnCard(card) {
    const w = card.item;
    const phase = state.cardPhase;
    const articleHtml = w.article
      ? `<span class="inline-block ${articleClass(w.article)} text-xs font-bold rounded-full px-2.5 py-1 mr-2 align-middle">${w.article}</span>`
      : '';
    const germanCore = w.article ? escapeHtml(stripArticlePrefix(w.german)) : escapeHtml(w.german);

    return `
      <main class="anim-slide" key="${w.german}">
        <div class="bg-white rounded-3xl border border-neutral-200 p-7 sm:p-9 shadow-sm">
          <div class="text-xs uppercase tracking-wider text-neutral-400 font-semibold mb-2">${posLabel(w.pos)}</div>
          <div class="text-3xl sm:text-4xl font-extrabold leading-tight mb-4 break-words">
            ${articleHtml}<span>${germanCore}</span>
          </div>
          ${phase === 'question' ? `
            <button data-action="reveal" class="w-full mt-5 py-4 rounded-2xl bg-flag-ink text-white font-bold text-lg hover:bg-neutral-800 transition">
              Reveal <span class="text-flag-gold/80 text-xs ml-2 font-medium">space</span>
            </button>` : `
            <div class="mt-4 anim-pop">
              <div class="text-xs uppercase tracking-wider text-neutral-400 font-semibold mb-1">English</div>
              <div class="text-xl sm:text-2xl font-semibold text-neutral-800">${escapeHtml(w.english)}</div>
              ${w.genderTip ? `
                <div class="mt-4 rounded-xl bg-amber-50 border border-amber-200 px-4 py-3 text-sm text-amber-900">
                  <span class="font-bold uppercase text-[10px] tracking-wider mr-1">Tip</span>${escapeHtml(w.genderTip)}
                </div>` : ''}
            </div>
            <div class="mt-6 grid grid-cols-2 gap-3">
              <button data-action="learn-missed"
                      class="py-4 rounded-2xl bg-white border-2 border-flag-red text-flag-red font-bold hover:bg-red-50 transition">
                Missed it <span class="block text-[10px] font-medium opacity-60 mt-0.5">1</span>
              </button>
              <button data-action="learn-got"
                      class="py-4 rounded-2xl bg-flag-ink text-white font-bold hover:bg-neutral-800 transition">
                Got it <span class="block text-[10px] font-medium opacity-60 mt-0.5">2</span>
              </button>
            </div>`}
        </div>
        <p class="text-center text-[11px] text-neutral-400 mt-4">space = reveal · 1 = missed · 2 = got it</p>
      </main>
    `;
  }

  // ----------- Vocab Drill card -----------
  function renderVocabDrillCard(card) {
    const w = card.item;
    const phase = state.cardPhase;
    const isNoun = w.pos === 'noun' && !!w.article;
    const showLessonTag = state.session.type === 'mixed-review';
    const fb = state.feedback;
    const selectedArticle = state.draft.article || '';
    const draftText = state.draft.text || '';

    let inputBlock = '';
    if (phase === 'question') {
      if (isNoun) {
        inputBlock = `
          <form id="drill-form" class="mt-6 space-y-3">
            <div class="flex items-center gap-2">
              <div class="flex gap-2 justify-center flex-1">
                ${['der','die','das'].map((a, i) => `
                  <button type="button" data-pill="${a}" tabindex="0"
                          class="pill ${selectedArticle === a ? 'active-' + a : ''} ${i === 0 ? 'js-autofocus' : ''}">${a}</button>
                `).join('')}
              </div>
              <button type="button" data-action="show-overlay-ref" data-ref="article-patterns"
                      class="text-[11px] text-neutral-500 hover:text-flag-red border border-neutral-200 rounded-full px-2.5 py-1 shrink-0"
                      title="Open Artikel-Patterns reference">📖 Patterns</button>
            </div>
            <input id="drill-input" type="text" inputmode="text" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false"
                   value="${escapeHtml(draftText)}"
                   placeholder="noun (e.g. Freundschaft)"
                   class="w-full px-4 py-4 rounded-2xl border-2 border-neutral-200 text-xl font-semibold focus:border-flag-ink transition" />
            <button type="submit"
                    class="w-full py-4 rounded-2xl bg-flag-ink text-white font-bold text-lg hover:bg-neutral-800 transition">
              Check <span class="text-flag-gold/80 text-xs ml-2 font-medium">enter</span>
            </button>
          </form>`;
      } else {
        inputBlock = `
          <form id="drill-form" class="mt-6 space-y-3">
            <input id="drill-input" type="text" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
                   value="${escapeHtml(draftText)}"
                   placeholder="German ${posLabel(w.pos).toLowerCase()}"
                   class="w-full px-4 py-4 rounded-2xl border-2 border-neutral-200 text-xl font-semibold focus:border-flag-ink transition js-autofocus" />
            <button type="submit"
                    class="w-full py-4 rounded-2xl bg-flag-ink text-white font-bold text-lg hover:bg-neutral-800 transition">
              Check <span class="text-flag-gold/80 text-xs ml-2 font-medium">enter</span>
            </button>
          </form>`;
      }
    }

    let feedbackBlock = '';
    if (phase === 'feedback' && fb) {
      const toneBg = fb.tone === 'green' ? 'bg-emerald-50 border-emerald-300 text-emerald-900'
                  : fb.tone === 'amber' ? 'bg-amber-50 border-amber-300 text-amber-900'
                  : 'bg-red-50 border-red-300 text-red-900';
      const icon = fb.tone === 'green' ? '✓' : fb.tone === 'amber' ? '!' : '✗';
      const animClass = fb.tone === 'green' ? 'anim-pop' : fb.tone === 'red' ? 'anim-shake' : 'anim-pop';
      const userArticle = state.draft.article || '';
      const userText = (state.draft.text || '').trim();
      const userAssembled = isNoun
        ? `${userArticle ? `<span class="inline-block ${articleClass(userArticle)} text-[10px] font-bold rounded-full px-1.5 py-0.5 mr-1">${userArticle}</span>` : ''}${escapeHtml(userText) || '<span class="opacity-40">(blank)</span>'}`
        : (escapeHtml(userText) || '<span class="opacity-40">(blank)</span>');
      const correctAssembled = isNoun
        ? `<span class="inline-block ${articleClass(w.article)} text-[10px] font-bold rounded-full px-1.5 py-0.5 mr-1">${w.article}</span>${escapeHtml(stripArticlePrefix(w.german))}`
        : escapeHtml(w.german);

      feedbackBlock = `
        <div class="${animClass} mt-5 rounded-2xl border-2 ${toneBg} px-4 py-4">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-white/80 flex items-center justify-center text-xl font-black">${icon}</div>
            <div class="font-bold text-lg">${fb.label}</div>
          </div>
          ${fb.kind !== 'correct' ? `
            <div class="mt-3 text-sm">
              <div class="flex gap-2"><span class="opacity-60 w-20 shrink-0">Your answer:</span><span class="font-semibold">${userAssembled}</span></div>
              <div class="flex gap-2"><span class="opacity-60 w-20 shrink-0">Correct:</span><span class="font-semibold">${correctAssembled}</span></div>
            </div>` : ''}
          ${(fb.showTip && w.genderTip) ? `
            <div class="mt-3 rounded-xl bg-amber-100 border border-amber-300 px-4 py-3 text-sm text-amber-900">
              <span class="font-bold uppercase text-[10px] tracking-wider mr-1">Gender tip</span>${escapeHtml(w.genderTip)}
            </div>` : ''}
        </div>
        <button data-action="vocab-continue" id="drill-continue"
                class="mt-5 w-full py-4 rounded-2xl bg-flag-ink text-white font-bold text-lg hover:bg-neutral-800 transition">
          Continue <span class="text-flag-gold/80 text-xs ml-2 font-medium">enter</span>
        </button>
      `;
    }

    return `
      <main class="anim-slide" key="${w.german}">
        <div class="bg-white rounded-3xl border border-neutral-200 p-6 sm:p-8 shadow-sm">
          ${showLessonTag ? `<div class="text-[11px] text-neutral-400 font-medium mb-2">Vokabeln · ${escapeHtml(card.lesson.title)}</div>` : ''}
          <div class="text-xs uppercase tracking-wider text-neutral-400 font-semibold mb-2">${posLabel(w.pos)}</div>
          <div class="text-2xl sm:text-3xl font-extrabold leading-tight break-words">${escapeHtml(w.english)}</div>
          ${inputBlock}
          ${feedbackBlock}
        </div>
        <p class="text-center text-[11px] text-neutral-400 mt-4">enter = check / continue</p>
      </main>
    `;
  }

  // ----------- Nebensatz card -----------
  function nebPrefix(item) {
    if (item.conjunction) return `${item.main_clause} ${item.conjunction}`;
    return item.main_clause;
  }
  function renderNebensatzCard(card) {
    const it = card.item;
    const phase = state.cardPhase;
    const showLessonTag = state.session.type === 'mixed-review';
    const fb = state.feedback;
    const userOrder = (state.draft.userOrder || []);
    const poolTokens = state.draft.pool || it.tokens.slice();
    const buildTokens = state.draft.build || [];
    const ready = poolTokens.length === 0 && buildTokens.length > 0;
    const correctSentence = `${nebPrefix(it)} ${it.correct_order.join(' ')}.`;

    let body;
    if (phase === 'feedback' && fb) {
      const toneBg = fb.tone === 'green' ? 'bg-emerald-50 border-emerald-300 text-emerald-900' : 'bg-red-50 border-red-300 text-red-900';
      const icon = fb.tone === 'green' ? '✓' : '✗';
      const animClass = fb.tone === 'green' ? 'anim-pop' : 'anim-shake';
      const userAssembledTokens = userOrder.map((tok, i) => {
        const right = it.correct_order[i] === tok;
        const cls = right ? 'token-right' : 'token-wrong';
        return `<span class="token-chip ${cls}">${escapeHtml(tok)}</span>`;
      }).join('');
      body = `
        <div class="bg-white rounded-3xl border border-neutral-200 p-6 sm:p-8 shadow-sm">
          ${showLessonTag ? `<div class="text-[11px] text-neutral-400 font-medium mb-2">Grammar · Nebensatz</div>` : ''}
          <div class="flex items-center gap-2 text-[11px] uppercase tracking-wider font-semibold text-neutral-400 mb-2">
            <span>Nebensatz · ${escapeHtml(it.type)}</span>
            ${it.perfekt ? `<span class="bg-flag-gold text-flag-ink px-2 py-0.5 rounded-full">Perfekt-Form</span>` : ''}
          </div>
          <div class="text-sm text-neutral-500 mb-3">${escapeHtml(it.prompt_en)}</div>
          <div class="text-base font-semibold leading-relaxed break-words">
            <span class="text-neutral-500">${escapeHtml(nebPrefix(it))}</span>
            <span class="ml-1 inline-flex flex-wrap gap-1.5 align-middle">${userAssembledTokens}</span>
            <span class="text-neutral-500">.</span>
          </div>
          <div class="${animClass} mt-5 rounded-2xl border-2 ${toneBg} px-4 py-4">
            <div class="flex items-center gap-3">

  function renderBlitzResults() {
    const b = state.session.blitz;
    const total = state.session.cards.length;
    const answered = state.session.idx;
    const correct = b.score;
    const missed = b.missed;
    const ranOut = answered < total;
    const missedSet = new Set(missed.map(m => m.item.id));
    const allRows = state.session.cards.map((c, i) => {
      const it = c.item;
      const wasMissed = missedSet.has(it.id);
      const wasUnanswered = i >= answered;
      const status = wasUnanswered ? 'skipped' : wasMissed ? 'missed' : 'correct';
      return { it, status };
    });
    allRows.sort((a, b) => {
      const order = { missed: 0, skipped: 1, correct: 2 };
      return order[a.status] - order[b.status];
    });
    return `
      <header class="pt-5 pb-4">
        <div class="flex items-center gap-3 mb-2">
          <button data-action="exit-session"
                  class="rounded-full w-9 h-9 flex items-center justify-center bg-white border border-neutral-200 hover:bg-neutral-50 transition" aria-label="Exit">
            <span class="text-lg leading-none">←</span>
          </button>
          <div class="flex-1">
            <div class="text-[11px] uppercase tracking-wider font-semibold text-flag-red">Blitz · results</div>
            <div class="text-sm font-semibold">haben/sein</div>
          </div>
        </div>

      <main class="anim-summary">
        <div class="bg-white rounded-3xl border border-neutral-200 p-6 sm:p-8 shadow-sm text-center mb-4">

          <div class="mt-2 text-5xl font-extrabold">${correct} / ${total}</div>
          <div class="text-sm text-neutral-500 mt-1">${answered} answered · ${missed.length} missed${ranOut ? ` · ${total - answered} skipped` : ''}</div>
          <button data-action="exit-session"
                  class="mt-5 w-full py-3 rounded-2xl bg-flag-ink text-white font-bold hover:bg-neutral-800 transition">
            Back to dashboard
          </button>
        </div>
        <div class="space-y-2">
          ${allRows.map(({it, status}) => `
            <div class="rounded-2xl border-2 ${status === 'correct' ? 'border-emerald-200 bg-emerald-50' : status === 'missed' ? 'border-red-200 bg-red-50' : 'border-neutral-200 bg-white'} p-3">
              <div class="flex items-center gap-2 mb-1">
                <div class="text-[10px] uppercase tracking-wider font-bold ${status === 'correct' ? 'text-emerald-700' : status === 'missed' ? 'text-red-700' : 'text-neutral-500'}">${status}</div>

              <div class="text-sm font-semibold mb-1">${escapeHtml(it.full_sentence)}</div>
              <div class="text-xs text-neutral-600">${escapeHtml(it.rule)}</div>
            </div>`).join('')}
        </div>
      </main>
    `;
  }

  // ============================================================
  //  Generic fill-in renderer parts
  // ============================================================
  function renderScaffoldInputs(scaffold, alternatives, blanks, blankFlags, phase) {
    const parts = splitScaffold(scaffold);
    let html = '';
    parts.forEach((part, i) => {
      html += escapeHtml(part);
      if (i < parts.length - 1) {
        const alts = alternatives[i] || [];
        const maxLen = alts.reduce((m, a) => Math.max(m, (a || '').length), 0);
        const w = `${Math.max(5, maxLen + 2)}ch`;
        const flag = blankFlags[i];
        const klass = flag === 'right' ? 'right' : flag === 'wrong' ? 'wrong' : '';
        const v = blanks[i] || '';
        const disabled = phase === 'feedback' ? 'readonly' : '';
        const auto = i === 0 ? 'js-autofocus' : '';
        html += `<input type="text" class="fill-input ${klass} ${auto}" data-blank="${i}" style="width:${w}" value="${escapeHtml(v)}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" ${disabled} />`;
      }
    });
    return html;
  }

  function feedbackToneClasses(tone) {
    return tone === 'green' ? 'bg-emerald-50 border-emerald-300 text-emerald-900' : 'bg-red-50 border-red-300 text-red-900';
  }

  function fillInWrongDetails(item, blanks, blankFlags, scaffoldField = 'scaffold') {
    return blankFlags.map((flag, i) => {
      if (flag !== 'wrong') return '';
      const correct = item.alternatives[i] && item.alternatives[i][0] != null ? item.alternatives[i][0] : item.answers[i];
      const userVal = (blanks[i] || '').trim();
      const display = userVal ? `<span class="line-through opacity-60">${escapeHtml(userVal)}</span>` : '<span class="opacity-50 italic">(blank)</span>';
      const correctDisplay = (correct === '' ? '<em>(no ending)</em>' : escapeHtml(correct));
      return `<div class="text-sm">${display} <span class="font-semibold">→ ${correctDisplay}</span></div>`;
    }).join('');
  }

  // ----------- Konjunktiv card -----------
  function renderKonjunktivCard(card) {
    const it = card.item;

    const showLessonTag = state.session.type === 'mixed-review';
    const fb = state.feedback;

    const blankFlags = state.draft.blankFlags || it.answers.map(()=> null);
    const scaffoldHtml = renderScaffoldInputs(it.scaffold, it.alternatives, blanks, blankFlags, phase);

    let feedbackBlock = '';
    if (phase === 'feedback' && fb) {
      const toneBg = feedbackToneClasses(fb.tone);

      const wrongDetails = fillInWrongDetails(it, blanks, blankFlags);
      feedbackBlock = `
        <div class="${animClass} mt-5 rounded-2xl border-2 ${toneBg} px-4 py-4">
          <div class="font-bold text-base mb-2">${fb.label}</div>
          ${wrongDetails}
          ${fb.kind !== 'correct' ? `
            <div class="mt-3 rounded-xl bg-white/70 border border-current/20 px-3 py-2 text-sm anim-hint">

        <button data-action="generic-continue" id="drill-continue"
                class="mt-5 w-full py-4 rounded-2xl bg-flag-ink text-white font-bold text-lg hover:bg-neutral-800 transition">

                Check <span class="text-flag-gold/80 text-xs ml-2 font-medium">enter</span>
              </button>` : ''}
            ${feedbackBlock}
          </div>
        </form>
        <p class="text-center text-[11px] text-neutral-400 mt-4">tab between blanks · enter to check</p>
      </main>
    `;
  }

  // ----------- Adjective card -----------
  function tableLabel(t) {
    if (t === 1) return 'Tab. 1 (no article)';
    if (t === 2) return 'Tab. 2 (def. article)';
    return 'Mixed (ein / kein / poss.)';
  }
  function genderLabel(g) {
    return ({m:'maskulin',f:'feminin',n:'neutrum',pl:'Plural'})[g] || g;
  }
  function renderAdjectiveCard(card) {
    const it = card.item;
    const phase = state.cardPhase;
    const showLessonTag = state.session.type === 'mixed-review';
    const fb = state.feedback;
    const blanks = state.draft.blanks || it.answers.map(()=> '');
    const blankFlags = state.draft.blankFlags || it.answers.map(()=> null);
    const scaffoldHtml = renderScaffoldInputs(it.prompt, it.alternatives, blanks, blankFlags, phase);

    // Decide whether to surface the declension mini-cell as positive reinforcement.
    // "Hard" item: the user has lapses on it OR its current SR interval is < 3 days.
    const isHardItem = card.state && (card.state.lapses > 0 || (card.state.interval || 0) < 3);

    let feedbackBlock = '';
    if (phase === 'feedback' && fb) {
      const toneBg = feedbackToneClasses(fb.tone);
      const animClass = fb.tone === 'green' ? 'anim-pop' : 'anim-shake';
      const wrongDetails = fillInWrongDetails(it, blanks, blankFlags, 'prompt');
      const miniCell = renderDeclMiniCell(it);
      feedbackBlock = `
        <div class="${animClass} mt-5 rounded-2xl border-2 ${toneBg} px-4 py-4">
          <div class="font-bold text-base mb-2">${fb.label}</div>
          ${wrongDetails}
          ${fb.kind !== 'correct' ? `
            <div class="mt-3 rounded-xl bg-amber-100 border border-amber-300 px-3 py-2 text-sm text-amber-900 anim-hint">

            <div class="mt-2 text-sm text-neutral-700">→ <span class="font-semibold">${escapeHtml(it.full)}</span></div>
            ${isHardItem ? miniCell : ''}`}

                class="mt-5 w-full py-4 rounded-2xl bg-flag-ink text-white font-bold text-lg hover:bg-neutral-800 transition">

              <div class="flex flex-wrap items-center gap-2 text-[11px] uppercase tracking-wider font-semibold">
                <span class="${t ? `${t.med} ${t.text}` : 'bg-neutral-100 text-neutral-700'} px-2.5 py-0.5 rounded-full">${escapeHtml(it.case)} · ${escapeHtml(genderLabel(it.gender))}</span>
                <span class="bg-neutral-100 text-neutral-700 px-2.5 py-0.5 rounded-full">${escapeHtml(tableLabel(it.table))}</span>
              </div>`; })()}
              <button type="button" data-action="show-overlay-ref" data-ref="declension"
                      class="text-[11px] text-neutral-500 hover:text-purple-700 border border-neutral-200 rounded-full px-2.5 py-1 shrink-0"

            </div>
            <div class="text-2xl sm:text-3xl font-extrabold leading-relaxed break-words">${scaffoldHtml}</div>
            ${phase === 'question' ? `
              <button type="submit" class="mt-6 w-full py-4 rounded-2xl bg-flag-ink text-white font-bold text-lg hover:bg-neutral-800 transition">
                Check <span class="text-flag-gold/80 text-xs ml-2 font-medium">enter</span>
              </button>` : ''}
            ${feedbackBlock}
          </div>

        <p class="text-center text-[11px] text-neutral-400 mt-4">tab between blanks · enter to check</p>
      </main>
    `;
  }

  // ----------- PraepLokal card -----------
  function dirOf(type) {
    if (type.startsWith('wo-'))    return { kind:'wo',    label:'Wo? Position' };
    if (type.startsWith('wohin')) return { kind:'wohin', label:'Wohin? Direction' };
    if (type.startsWith('woher')) return { kind:'woher', label:'Woher? Origin' };
    return { kind:'wo', label:'Lokal' };
  }
  function renderPraepLokalCard(card) {
    const it = card.item;
    const phase = state.cardPhase;
    const showLessonTag = state.session.type === 'mixed-review';
    const fb = state.feedback;
    const blanks = state.draft.blanks || it.answers.map(()=> '');
    const blankFlags = state.draft.blankFlags || it.answers.map(()=> null);
    const scaffoldHtml = renderScaffoldInputs(it.scaffold, it.alternatives, blanks, blankFlags, phase);
    const dir = dirOf(it.type);
    const arrow = dir.kind === 'wohin' ? '➡' : dir.kind === 'woher' ? '⬅' : '◎';

    let feedbackBlock = '';
    if (phase === 'feedback' && fb) {
      const toneBg = feedbackToneClasses(fb.tone);
      const animClass = fb.tone === 'green' ? 'anim-pop' : 'anim-shake';
      const wrongDetails = fillInWrongDetails(it, blanks, blankFlags);
      feedbackBlock = `

  // ============================================================
  //  Session lifecycle
  // ============================================================
  function freshSession(extras) {
    // exitTo defaults to whichever section the user came from (last_section)
    const last = (getUIPrefs().last_section) || 'hub';
    return { idx:0, stats:{ correct:0, partial:0, wrong:0, future:0 }, streak:0, exitTo: last, ...extras };
  }
  function shuffleArray(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  // Shuffle but never end up matching the correct order verbatim.
  function shuffledTokens(tokens, correct) {
    if (!tokens || tokens.length <= 1) return (tokens || []).slice();
    const matches = (arr) => correct && arr.length === correct.length && arr.every((t, i) => t === correct[i]);
    let attempts = 0;
    let candidate = shuffleArray(tokens);
    while (matches(candidate) && attempts < 10) {
      candidate = shuffleArray(tokens);
      attempts++;
    }
    if (matches(candidate)) {
      // last-ditch deterministic disturbance: swap first two
      [candidate[0], candidate[1]] = [candidate[1], candidate[0]];
    }
    return candidate;
  }

  function initDraftForCard(card) {
    if (!card) return {};
    if (card.kind === 'nebensatz') {
      return {
        pool:  shuffledTokens(card.item.tokens, card.item.correct_order),
        build: [],
        userOrder: [],
      };
    }
    if (card.kind === 'vocab' || card.kind === 'habensein') return {};
    // fill-in card
    const answers = card.item.answers || [];
    return { blanks: answers.map(()=> ''), blankFlags: answers.map(()=> null) };
  }

  function startVocabLearn(lessonIdx) {
    const lesson = LESSONS[lessonIdx];
    const cards = pickVocabSession(lesson, SESSION_SIZE);

    state.session = freshSession({ type:'vocab-learn', title:lesson.title, lessonIdx, cards });
    state.cardPhase = 'question'; state.feedback = null; state.draft = {};
    state.view = 'session'; render();
  }
  function startVocabDrill(lessonIdx) {
