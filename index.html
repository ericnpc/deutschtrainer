  function startHabenSeinBlitz() {
    const shuffled = HABEN_SEIN_ITEMS.slice().sort(() => Math.random() - 0.5).slice(0, BLITZ_SIZE);
    const cards = shuffled.map(it => ({ kind:'habensein', item:it, state:getItemState('habenSein', it.id) }));
    state.session = freshSession({
      type:'habensein-blitz', title:'haben/sein · Blitz', cards,
      blitz:{ score:0, missed:[], endTime:0, timerId:null, ended:false },
    });
    state.cardPhase = 'question'; state.feedback = null; state.draft = {};
    state.view = 'session'; render();
    startBlitzTimer();
  }

  function continueSession() {
    const s = state.session;
    if (!s) return;
    let more = [];
    if (s.type === 'mixed-review')                more = pickMixedReview(REVIEW_SIZE);
    else if (s.type === 'vocab-learn' || s.type === 'vocab-drill')
                                                  more = pickVocabSession(LESSONS[s.lessonIdx], SESSION_SIZE);
    else if (s.type === 'habensein-practice')     more = pickGrammarSession('habensein', SESSION_SIZE);
    else if (moduleByKind(s.type))                more = pickGrammarSession(s.type, SESSION_SIZE);
    if (!more.length) { showToast('Nothing more to pull'); return; }
    s.cards = [...s.cards, ...more];
    state.cardPhase = 'question'; state.feedback = null;
    state.draft = initDraftForCard(more[0]);
    render();
  }

  function exitSession() {
    if (state.session && state.session.blitz && state.session.blitz.timerId) {
      clearInterval(state.session.blitz.timerId);
    }
    if (state.session && state.session.idx > 0 && state.session.type !== 'habensein-blitz') {
      const total = state.session.idx;
      const c = state.session.stats.correct;
      showToast(`Saved · ${c}/${total} correct`);
    }
    state.view = (state.session && state.session.exitTo) ? state.session.exitTo : 'hub';
    state.session = null;
    state.cardPhase = 'question';
    state.feedback = null;
    state.draft = {};
    render();
  }

  // ============================================================
  //  Grade / advance
  // ============================================================
  function ingestGrade(card, grade) {
    const type = kindToType(card.kind);
    const key  = itemKey(card.kind, card.item);
    const newState = applyGrade(card.state, grade);
    setItemState(type, key, newState);
    card.state = newState;
    if (newState.due > Date.now()) state.session.stats.future += 1;
    if (grade === 'correct' || grade === 'easy') {
      state.session.stats.correct += 1;
      state.session.streak = (state.session.streak || 0) + 1;
    } else if (grade === 'partial' || grade === 'partial-konj') {
      state.session.stats.partial += 1;
      state.session.streak = 0;
    } else {
      // wrong, wrong-hard, partial-modal counted as wrong
      state.session.stats.wrong += 1;
      state.session.streak = 0;
    }
    recordSessionDay();
  }
  function advanceCard() {
    state.session.idx += 1;
    state.cardPhase = 'question';
    state.feedback = null;
    state.draft = {};
    if (state.session.idx < state.session.cards.length) {
      const next = state.session.cards[state.session.idx];
      state.draft = initDraftForCard(next);
    }
    render();
  }

  // ----- Vocab grading -----
  function gradeVocabFromInput(card) {
    const w = card.item;
    const isNoun = w.pos === 'noun' && !!w.article;
    const article = state.draft.article || '';
    const text = state.draft.text || '';
    if (isNoun) {
      const correctNoun = normalize(stripArticlePrefix(w.german));
      const userNoun    = normalize(stripArticlePrefix(text));
      const articleOk   = article.toLowerCase() === w.article.toLowerCase();
      const wordOk      = userNoun.length > 0 && userNoun === correctNoun;
      if (articleOk && wordOk) return { kind:'correct', label:'Perfect!', tone:'green' };
      if (wordOk && !articleOk) return { kind:'partial', label:'Right word — wrong gender', tone:'amber', showTip:true };
      if (!wordOk && articleOk) return { kind:'partial', label:'Right gender — wrong word', tone:'amber' };
      return { kind:'wrong', label:'Not quite', tone:'red', showTip:true };
    }
    const correct = normalize(w.german);
    const user    = normalize(text);
    if (user.length > 0 && user === correct) return { kind:'correct', label:'Perfect!', tone:'green' };
    return { kind:'wrong', label:'Not quite', tone:'red' };
  }
  function checkVocab() {
    const card = state.session.cards[state.session.idx];
    const input = document.getElementById('drill-input');
    if (input) state.draft.text = input.value;
    state.feedback = gradeVocabFromInput(card);
    state.cardPhase = 'feedback';
    render();
    const cont = document.getElementById('drill-continue');
    if (cont) cont.focus();
  }

  // ----- Nebensatz grading -----
  function checkNebensatz() {
    const buildEl = document.getElementById('neb-build');
    const poolEl  = document.getElementById('neb-pool');
    if (!buildEl || !poolEl) return;
    const order = Array.from(buildEl.children).map(el => el.dataset.token);
    const pool  = Array.from(poolEl.children).map(el => el.dataset.token);
    if (pool.length > 0) { showToast('Place all tokens first'); return; }
    const card = state.session.cards[state.session.idx];
    const correct = card.item.correct_order;
    const isRight = order.length === correct.length && order.every((t, i) => t === correct[i]);
    state.draft.userOrder = order; state.draft.build = order; state.draft.pool = [];
    state.feedback = isRight
      ? { kind:'correct', label:'Genau richtig!', tone:'green' }
      : { kind:'wrong',   label:'Word order is off', tone:'red' };
    state.cardPhase = 'feedback';
    if (!isRight) flashScreen('red');
    render();
    const cont = document.getElementById('drill-continue');
    if (cont) cont.focus();
  }

  // ----- haben/sein practice grading -----
  function pickHabenSein(form) {
    const card = state.session.cards[state.session.idx];
    const isRight = form === card.item.answer;
    state.draft.picked = form;
    state.feedback = isRight
      ? { kind:'correct', label:'Richtig!',  tone:'green' }
      : { kind:'wrong',   label:'Not quite', tone:'red' };
    state.cardPhase = 'feedback';
    render();
    const cont = document.getElementById('drill-continue');
    if (cont) cont.focus();
  }

  // ----- Generic fill-in grading -----
  function checkFillIn() {
    const card = state.session.cards[state.session.idx];
    const it = card.item;
    const answers = it.answers || [];
    const blanks = answers.map((_, i) => {
      const el = document.querySelector(`input.fill-input[data-blank="${i}"]`);
      return el ? el.value : '';
    });
    const flags = blanks.map((v, i) => {
      const alts = (it.alternatives[i] && it.alternatives[i].length ? it.alternatives[i] : [it.answers[i]]).map(normalize);
      return alts.includes(normalize(v)) ? 'right' : 'wrong';
    });
    state.draft.blanks = blanks;
    state.draft.blankFlags = flags;
    const allRight = flags.every(f => f === 'right');
    state.feedback = allRight
      ? { kind:'correct', label:'Alles richtig!',           tone:'green' }
      : { kind:'wrong',   label:'Some blanks need fixing',  tone:'red' };
    state.cardPhase = 'feedback';
    render();
    const cont = document.getElementById('drill-continue');
    if (cont) cont.focus();
  }

  function fillInGradeForKind(kind, allRight) {
    if (allRight) return 'correct';
    switch (kind) {
      case 'verbPraep':    return 'wrong-hard';
      case 'modalPerfekt': return 'partial-modal';
      case 'konjunktiv':
      case 'adjective':
      case 'praepLokal':   return 'partial-konj';
      case 'relativ':
      default:             return 'wrong';
    }
  }

  // Generic continue handler — dispatches to the card's grade type
  function genericContinue() {
    const card = state.session.cards[state.session.idx];
    const fb = state.feedback;
    if (!card || !fb) return;
    let grade;
    if (card.kind === 'vocab') {
      grade = fb.kind; // 'correct' | 'partial' | 'wrong'
    } else if (card.kind === 'nebensatz') {
      grade = fb.kind; // 'correct' | 'wrong'
    } else if (card.kind === 'habensein') {
      grade = fb.kind; // 'correct' | 'wrong'
    } else {
      // fill-in card
      grade = fillInGradeForKind(card.kind, fb.kind === 'correct');
    }
    ingestGrade(card, grade);
    advanceCard();
  }

  function learnAdvance(grade) {
    const card = state.session.cards[state.session.idx];
    ingestGrade(card, grade);
    advanceCard();
  }

  // ----- Blitz -----
  function startBlitzTimer() {
    const s = state.session;
    s.blitz.endTime = Date.now() + BLITZ_TIME;
    s.blitz.timerId = setInterval(() => {
      const left = Math.max(0, s.blitz.endTime - Date.now());
      const el = document.querySelector('#blitz-timer');
      if (el) el.textContent = (left / 1000).toFixed(1) + 's';
      if (left <= 0) { clearInterval(s.blitz.timerId); endBlitz(); }
    }, 100);
  }
  function pickHabenSeinBlitz(form) {
    const s = state.session;
    if (s.blitz.ended) return;
    const card = s.cards[s.idx];
    const isRight = form === card.item.answer;
    if (isRight) s.blitz.score += 1;
    else s.blitz.missed.push({ item: card.item, picked: form });
    flashScreen(isRight ? 'green' : 'red');
    s.idx += 1;
    if (s.idx >= s.cards.length) {
      clearInterval(s.blitz.timerId);
      endBlitz();
    } else render();
  }
  function endBlitz() {
    const s = state.session;
    if (!s) return;
    s.blitz.ended = true;
    if (s.blitz.timerId) clearInterval(s.blitz.timerId);
    recordSessionDay();
    state.view = 'blitz-results';
    render();
  }

  // ============================================================
  //  Event wiring
  // ============================================================
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-action], [data-pill], [data-token]');
    if (!t) return;

    if (t.dataset.pill) {
      state.draft = state.draft || {};
      state.draft.article = t.dataset.pill;
      const input = document.getElementById('drill-input');
      if (input) state.draft.text = input.value;
      render();
      const fresh = document.getElementById('drill-input');
      if (fresh) fresh.focus();
      return;
    }

    // Token tap-to-move
    if (t.dataset.token && state.cardPhase === 'question' && state.session) {
      const cur = state.session.cards[state.session.idx];
      if (cur && cur.kind === 'nebensatz') {
        const pool = document.getElementById('neb-pool');
        const build = document.getElementById('neb-build');
        if (!pool || !build) return;
        if (t.parentElement === pool) build.appendChild(t);
        else if (t.parentElement === build) pool.appendChild(t);
        const ready = pool.children.length === 0 && build.children.length > 0;
        const btn = document.getElementById('neb-check');
        if (btn) {
          btn.disabled = !ready;
          btn.className = `mt-5 w-full py-4 rounded-2xl ${ready ? 'bg-flag-ink text-white hover:bg-neutral-800' : 'bg-neutral-200 text-neutral-400 cursor-not-allowed'} font-bold text-lg transition`;
        }
        return;
      }
    }

    const action = t.dataset.action;
    switch (action) {
      case 'start-learn':            startVocabLearn(parseInt(t.dataset.lesson, 10)); break;
      case 'start-drill':            startVocabDrill(parseInt(t.dataset.lesson, 10)); break;
      case 'start-mixed':            startMixedReview(); break;
      case 'start-grammar':          startGrammar(t.dataset.kind); break;
      case 'open-habensein':         state.view = 'habensein-mode'; render(); break;
      case 'back-to-dashboard':      state.view = 'hub'; render(); break;
      case 'start-habensein-practice': startHabenSeinPractice(); break;
      case 'start-habensein-blitz':  startHabenSeinBlitz(); break;

      case 'exit-session':           exitSession(); break;
      case 'session-continue':       continueSession(); break;
      case 'blitz-quit':             endBlitz(); break;

      case 'reveal':                 state.cardPhase = 'reveal'; render(); break;
      case 'learn-got':              learnAdvance('easy'); break;
      case 'learn-missed':           learnAdvance('wrong'); break;

      case 'vocab-continue':         genericContinue(); break;
      case 'generic-continue':       genericContinue(); break;
      case 'nebensatz-check':        checkNebensatz(); break;
      case 'hs-pick':                pickHabenSein(t.dataset.form); break;
      case 'hs-blitz-pick':          pickHabenSeinBlitz(t.dataset.form); break;

      case 'confirm-reset':          state.view = 'reset-confirm'; render(); break;
      case 'cancel-reset':           state.view = 'hub'; render(); break;
      case 'do-reset':               clearAllProgress(); state.view = 'hub'; showToast('Progress cleared'); render(); break;

      case 'open-reference': {
        const r = t.dataset.ref;
        state.navDir = 'forward';
        if (r === 'verb-position')         state.view = 'reference-verb';
        else if (r === 'article-patterns') state.view = 'reference-article';
        else if (r === 'declension')       state.view = 'reference-decl';
        render();
        break;
      }
      case 'show-overlay-ref': {
        const r = t.dataset.ref;
        if (r === 'verb-position')         state.overlay = 'verb-position';
        else if (r === 'article-patterns') state.overlay = 'article-patterns';
        else if (r === 'declension')       state.overlay = 'declension';
        render();
        break;
      }
      case 'open-section': {
        state.navDir = 'forward';
        state.view = t.dataset.section;
        render();
        break;
      }
      case 'back-to-hub': {
        state.navDir = 'back';
        state.view = 'hub';
        render();
        break;
      }
      case 'decl-toggle-cell': {
        const id = t.dataset.cell;
        state.declOpenCell = (state.declOpenCell === id) ? null : id;
        render();
        break;
      }
      case 'decl-pick-case': {
        state.declMobileCase = t.dataset.case;
        render();
        break;
      }
      case 'close-overlay':          state.overlay = null; render(); break;

      case 'open-schreiben':         state.view = 'schreiben-home'; render(); break;
      case 'open-sprechen':          state.view = 'sprechen-home';  render(); break;

      case 'open-editor': {
        const area = t.dataset.area;
        const taskId = t.dataset.task;
        // Persist any in-flight edit before swapping
        if (state.editor) persistEditorDraft();
        state.editor = initEditorFromDraft(area, taskId);
        state.view = (area === 'schreiben') ? 'schreiben-editor' : 'sprechen-editor';
        render();
        break;
      }
      case 'close-editor': {
        if (editorSaveTimer) { clearTimeout(editorSaveTimer); editorSaveTimer = null; }
        if (state.editor) persistEditorDraft();
        const area = state.editor && state.editor.area;
        state.editor = null;
        state.view = area === 'schreiben' ? 'section-editors' : area === 'sprechen' ? 'section-editors' : 'hub';
        render();
        break;
      }
      case 'back-to-dashboard':
        state.view = 'hub'; render(); break;

      case 'toggle-section-rm': {
        if (!state.editor) break;
        const title = t.dataset.sectionTitle;
        const e = state.editor;
        const cur = e.expandedSections || {};
        // resolve default if unset
        const sectionsData = e.area === 'schreiben'
          ? (getSchreibenTask(e.taskId) || {}).sections || []
          : (getSprechenTask(e.taskId) || {}).sections || [];
        const idx = sectionsData.findIndex(s => s.title === title);
        const wasOpen = cur[title] !== undefined ? cur[title] : (idx < 3);
        cur[title] = !wasOpen;
        e.expandedSections = cur;
        persistEditorDraft();
        render();
        break;
      }
      case 'toggle-mobile-sidebar':
        if (state.editor) { state.editor.sidebarOpenMobile = !state.editor.sidebarOpenMobile; render(); }
        break;

      case 'insert-phrase': {
        const phrase = t.dataset.phrase;
        const ta = document.getElementById('editor-body') || document.querySelector('textarea.js-editor-area');
        if (!ta || !state.editor) break;
        insertPhraseAt(ta, phrase);
        // Update model from textarea
        const idx = parseInt(ta.dataset.slideIdx || '0', 10);
        if (state.editor.taskId === 'presentation') {
          state.editor.slides[idx] = ta.value;
          state.editor.lastFocusedSlide = idx;
        } else {
          state.editor.body = ta.value;
        }
        scheduleEditorAutosave();
        // Auto-collapse mobile sidebar after insertion
        if (state.editor.sidebarOpenMobile) {
          state.editor.sidebarOpenMobile = false;
          // Don't full-rerender immediately; let the textarea retain focus.
          // Schedule a render once user moves on.
        }
        break;
      }
      case 'insert-phrase-into': {
        const phrase = t.dataset.phrase;
        const idxAttr = t.dataset.slideIdx;
        const e = state.editor;
        if (!e) break;
        let target;
        if (idxAttr !== undefined) {
          target = document.querySelector(`textarea.js-editor-area[data-slide-idx="${idxAttr}"]`);
        } else {
          // general toolbar — use last focused
          const idx = e.lastFocusedSlide || 0;
          target = document.querySelector(`textarea.js-editor-area[data-slide-idx="${idx}"]`);
        }
        if (!target) break;
        insertPhraseAt(target, phrase);
        const i = parseInt(target.dataset.slideIdx || '0', 10);
        if (e.taskId === 'presentation') {
          e.slides[i] = target.value;
          e.lastFocusedSlide = i;
        } else {
          e.body = target.value;
        }
        scheduleEditorAutosave();
        break;
      }

      case 'insert-scenario': {
        const e = state.editor;
        if (!e || e.taskId !== 'planning') break;
        const sel = document.querySelector('select[data-field="scenario"]');
        const sc = (sel && sel.value) || e.scenario || '';
        if (!sc) { showToast('Wähle erst ein Szenario aus'); break; }
        e.scenario = sc;
        const ta = document.getElementById('editor-body');
        if (ta) {
          const head = `Szenario: ${sc}\n\n`;
          const body = ta.value;
          if (!body.startsWith('Szenario:')) {
            ta.value = head + body;
          } else {
            ta.value = head + body.replace(/^Szenario:[^\n]*\n+/, '');
          }
          e.body = ta.value;
          ta.focus();
        }
        persistEditorDraft();
        render();
        break;
      }

      case 'open-vorlagen-overlay': {
        if (!state.editor) break;
        state.overlay = { type:'vorlagen', area: state.editor.area, taskId: state.editor.taskId };
        render();
        break;
      }
      case 'save-vorlage': {
        const e = state.editor;
        if (!e) break;
        const def = e.title || (e.area === 'schreiben' ? 'Mein Brief' : e.taskId === 'presentation' ? 'Meine Präsentation' : 'Mein Dialog');
        const name = (window.prompt('Name der Vorlage:', def) || '').trim();
        if (!name) break;
        const entry = {
          name,
          body: e.body || '',
        };
        if (e.area === 'schreiben') {
          entry.body = e.body || '';
        } else if (e.taskId === 'planning') {
          entry.body = e.body || '';
        } else if (e.taskId === 'presentation') {
          entry.body = (e.slides || []).join('\n\n');
        }
        const saved = saveVorlage(e.area, e.taskId, entry);
        if (e.taskId === 'presentation' && e.slides) {
          // store slides + topic too — re-fetch and patch
          const s = loadState();
          const bucket = s.sprechen_vorlagen[e.taskId];
          const v = bucket[bucket.length - 1];
          if (v && v.id === saved.id) {
            v.slides = e.slides.slice();
            v.topic  = e.topic || '';
            saveState(s);
          }
        }
        e.loadedVorlageId = saved.id;
        recordSessionDay();
        showToast('Als Vorlage gespeichert');
        render();
        break;
      }
      case 'load-vorlage': {
        const e = state.editor;
        if (!e) break;
        const id = t.dataset.id;
        const list = listVorlagen(e.area, e.taskId);
        const v = list.find(x => x.id === id);
        if (!v) break;
        const dirty = (e.body && e.body.trim()) || (e.slides && e.slides.some(s => s.trim()));
        if (dirty && !window.confirm('Aktuellen Entwurf überschreiben?')) break;
        if (e.area === 'schreiben') {
          e.title = v.name && /Beispiel:/.test(v.name) ? '' : (e.title || '');
          e.body = v.body || '';
        } else if (e.taskId === 'planning') {
          e.body = v.body || '';
        } else if (e.taskId === 'presentation') {
          if (v.slides && v.slides.length === 5) e.slides = v.slides.slice();
          else e.slides = (v.body || '').split(/\n\n+/).slice(0,5);
          while (e.slides.length < 5) e.slides.push('');
          if (v.topic) e.topic = v.topic;
        }
        e.loadedVorlageId = v.id;
        state.overlay = null;
        persistEditorDraft();
        render();
        break;
      }
      case 'delete-vorlage': {
        const e = state.editor;
        if (!e) break;
        const id = t.dataset.id;
        if (!window.confirm('Vorlage wirklich löschen?')) break;
        deleteVorlage(e.area, e.taskId, id);
        showToast('Vorlage gelöscht');
        render();
        break;
      }
      case 'copy-vorlage': {
        const e = state.editor;
        if (!e) break;
        const id = t.dataset.id;
        const list = listVorlagen(e.area, e.taskId);
        const v = list.find(x => x.id === id);
        if (!v) break;
        const newName = (window.prompt('Name der Kopie:', `${v.name} (Kopie)`) || '').trim();
        if (!newName) break;
        const entry = { name: newName, body: v.body || '' };
        const saved = saveVorlage(e.area, e.taskId, entry);
        if (v.slides) {
          const s = loadState();
          const bucket = s.sprechen_vorlagen[e.taskId];
          const last = bucket[bucket.length - 1];
          if (last && last.id === saved.id) {
            last.slides = v.slides.slice();
            last.topic  = v.topic || '';
            saveState(s);
          }
        }
        showToast('Kopie erstellt');
        render();
        break;
      }

      case 'new-draft': {
        const e = state.editor;
        if (!e) break;
        if (!window.confirm('Aktuellen Entwurf als verworfen markieren?')) break;
        if (e.area === 'schreiben') { e.title = ''; e.body = ''; }
        else if (e.taskId === 'planning') { e.scenario = ''; e.body = ''; }
        else if (e.taskId === 'presentation') { e.topic = ''; e.slides = ['','','','','']; }
        e.loadedVorlageId = null;
        persistEditorDraft();
        render();
        break;
      }
      case 'export-current': {
        const e = state.editor;
        if (!e) break;
        let txt = '';
        if (e.area === 'schreiben') {
          txt = (e.title ? e.title + '\n\n' : '') + (e.body || '');
        } else if (e.taskId === 'planning') {
          txt = (e.scenario ? 'Szenario: ' + e.scenario + '\n\n' : '') + (e.body || '');
        } else {
          if (e.topic) txt += 'Thema: ' + e.topic + '\n\n';
          PRES_SLIDE_TITLES.forEach((title, i) => {
            const body = e.slides[i] || '';
            if (body.trim()) txt += title + '\n' + body + '\n\n';
          });
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(
            () => showToast('In die Zwischenablage kopiert'),
            () => showToast('Kopieren fehlgeschlagen')
          );
        } else {
          showToast('Clipboard nicht verfügbar');
        }
        break;
      }

      case 'open-vorlesen': {
        if (!state.editor) break;
        persistEditorDraft();
        state.view = 'vorlesen';
        render();
        break;
      }
      case 'close-vorlesen': {
        stopVorlesenTimer();
        if (!state.editor) { state.view = 'hub'; render(); break; }
        state.view = (state.editor.area === 'schreiben') ? 'schreiben-editor' : 'sprechen-editor';
        render();
        break;
      }
      case 'speak-all':  speakText(buildVorlesenText()); break;
      case 'speak-stop': if (ttsAvailable()) { try { window.speechSynthesis.cancel(); } catch {} } break;

      case 'export-vorlagen': {
        const md = buildVorlagenMarkdown();
        const stamp = new Date().toISOString().slice(0,10);
        downloadFile(`b1trainer-vorlagen-${stamp}.md`, md);
        showToast('Markdown heruntergeladen');
        break;
      }
      case 'export-progress':  exportProgress(); break;
      case 'import-progress':  triggerImportPicker(); break;
    }
  });

  // Editor inputs — update state.editor live, debounced autosave
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (!state.editor) return;
    if (!t.matches || !t.matches('[data-field]')) return;
    const field = t.dataset.field;
    const e2 = state.editor;
    if (field === 'title')         e2.title    = t.value;
    else if (field === 'body')     e2.body     = t.value;
    else if (field === 'scenario') e2.scenario = t.value;
    else if (field === 'topic')    e2.topic    = t.value;
    else if (field === 'slide') {
      const idx = parseInt(t.dataset.slideIdx || '0', 10);
      if (!e2.slides) e2.slides = ['','','','',''];
      e2.slides[idx] = t.value;
      e2.lastFocusedSlide = idx;
    }
    scheduleEditorAutosave();
  });

  document.addEventListener('change', (e) => {
    const t = e.target;
    if (!state.editor) return;
    if (t.tagName !== 'SELECT' || !t.dataset.field) return;
    const field = t.dataset.field;
    if (field === 'topic') {
      state.editor.topic = t.value;
      const input = document.querySelector('input[data-field="topic"]');
      if (input && input !== t) input.value = t.value;
      scheduleEditorAutosave();
    } else if (field === 'scenario') {
      state.editor.scenario = t.value;
      scheduleEditorAutosave();
    }
  });

  document.addEventListener('focusin', (e) => {
    const t = e.target;
    if (!state.editor || !t.matches) return;
    if (t.matches('textarea[data-field="slide"]')) {
      state.editor.lastFocusedSlide = parseInt(t.dataset.slideIdx || '0', 10);
    }
  });

  document.addEventListener('submit', (e) => {
    if (!e.target) return;
    if (e.target.id === 'drill-form') {
      e.preventDefault();
      if (state.cardPhase !== 'question' || !state.session) return;
      checkVocab();
    } else if (e.target.id === 'fill-form') {
      e.preventDefault();
      if (state.cardPhase !== 'question' || !state.session) return;
      checkFillIn();
    }
  });

  document.addEventListener('keydown', (e) => {
    if (state.overlay && e.key === 'Escape') { state.overlay = null; render(); return; }
    if (state.view !== 'session') {
      if (state.view === 'reset-confirm' && e.key === 'Escape') { state.view = 'hub'; render(); }
      return;
    }
    const s = state.session;
    if (!s || s.idx >= s.cards.length) return;
    const card = s.cards[s.idx];
    if (!card) return;

    // Vocab Learn
    if (s.type === 'vocab-learn') {
      if (state.cardPhase === 'question' && e.code === 'Space') { e.preventDefault(); state.cardPhase = 'reveal'; render(); }
      else if (state.cardPhase === 'reveal' && e.key === '1') { e.preventDefault(); learnAdvance('wrong'); }
      else if (state.cardPhase === 'reveal' && e.key === '2') { e.preventDefault(); learnAdvance('easy'); }
      return;
    }

    // haben/sein keys
    if (card.kind === 'habensein') {
      if (s.type === 'habensein-blitz' && state.cardPhase === 'question' && (e.key === '1' || e.key === '2')) {
        e.preventDefault();
        const forms = SUBJECT_FORMS[card.item.subject_form] || [];
        const idx = e.key === '1' ? 0 : 1;
        if (forms[idx]) pickHabenSeinBlitz(forms[idx]);
        return;
      }
      if (state.cardPhase === 'question' && (e.key === '1' || e.key === '2')) {
        e.preventDefault();
        const forms = SUBJECT_FORMS[card.item.subject_form] || [];
        const idx = e.key === '1' ? 0 : 1;
        if (forms[idx]) pickHabenSein(forms[idx]);
        return;
      }
      if (state.cardPhase === 'feedback' && e.key === 'Enter') {
        e.preventDefault(); genericContinue(); return;
      }
    }

    // Nebensatz
    if (card.kind === 'nebensatz') {
      if (state.cardPhase === 'feedback' && e.key === 'Enter') { e.preventDefault(); genericContinue(); return; }
      if (state.cardPhase === 'question' && e.key === 'Enter') {
        e.preventDefault();
        const buildEl = document.getElementById('neb-build');
        const poolEl  = document.getElementById('neb-pool');
        if (buildEl && poolEl && poolEl.children.length === 0 && buildEl.children.length > 0) checkNebensatz();
        return;
      }
    }

    // Vocab drill / Mixed Review (vocab kind) — Enter on feedback advances
    if (card.kind === 'vocab' && s.type !== 'vocab-learn') {
      if (state.cardPhase === 'feedback' && e.key === 'Enter') { e.preventDefault(); genericContinue(); return; }
    }

    // Fill-in cards (Konjunktiv, Adjective, PraepLokal, VerbPraep, ModalPerfekt, Relativ)
    const fillKinds = ['konjunktiv','adjective','praepLokal','verbPraep','modalPerfekt','relativ'];
    if (fillKinds.includes(card.kind)) {
      if (state.cardPhase === 'feedback' && e.key === 'Enter') { e.preventDefault(); genericContinue(); return; }
    }
  });

  // ============================================================
  //  After-render hooks
  // ============================================================
  let nebSortPool = null, nebSortBuild = null;
  function teardownSortables() {
    if (nebSortPool)  { try { nebSortPool.destroy();  } catch {} nebSortPool = null; }
    if (nebSortBuild) { try { nebSortBuild.destroy(); } catch {} nebSortBuild = null; }
  }
  function setupNebensatzSortables() {
    teardownSortables();
    const pool  = document.getElementById('neb-pool');
    const build = document.getElementById('neb-build');
    if (!pool || !build || typeof Sortable === 'undefined') return;
    const opts = {
      group: 'tokens',
      animation: 200,
      ghostClass: 'token-ghost',
      dragClass: 'token-drag',
      forceFallback: true,
      fallbackOnBody: true,
      fallbackTolerance: 5,
      delayOnTouchOnly: false,
      onEnd: () => {
        const ready = pool.children.length === 0 && build.children.length > 0;
        const btn = document.getElementById('neb-check');
        if (btn) {
          btn.disabled = !ready;
          btn.className = `mt-5 w-full py-4 rounded-2xl ${ready ? 'bg-flag-ink text-white hover:bg-neutral-800' : 'bg-neutral-200 text-neutral-400 cursor-not-allowed'} font-bold text-lg transition`;
        }
        const last = build.lastElementChild;
        if (last) {
          last.classList.add('anim-drop');
          setTimeout(() => last.classList.remove('anim-drop'), 260);
        }
      },
    };
    nebSortPool  = Sortable.create(pool,  opts);
    nebSortBuild = Sortable.create(build, opts);
  }

  function afterRender() {
    teardownSortables();
    if (state.view !== 'session' || !state.session) return;
    const s = state.session;
    if (s.idx >= s.cards.length) return;
    const card = s.cards[s.idx];
    if (!card) return;
    if (card.kind === 'nebensatz' && state.cardPhase === 'question') setupNebensatzSortables();
    if (state.cardPhase === 'question') {
      const focusable = document.querySelector('.js-autofocus');
      if (focusable) setTimeout(() => focusable.focus(), 30);
    } else if (state.cardPhase === 'feedback') {
      const cont = document.getElementById('drill-continue');
      if (cont) setTimeout(() => cont.focus(), 30);
    }
  }

  function persistEditorDraft() {
    if (!state.editor) return;
    const e = state.editor;
    const data = {
      title: e.title, body: e.body, scenario: e.scenario,
      topic: e.topic, slides: e.slides,
      loadedVorlageId: e.loadedVorlageId,
      expandedSections: e.expandedSections,
    };
    setDraft(e.area, e.taskId, data);
    // Streak: any editor save where total content ≥ 50 chars counts the day
    const total = (e.body || '') + (e.title || '') + (e.scenario || '') + (e.topic || '') + ((e.slides || []).join(''));
    if (total.replace(/\s+/g,'').length >= 50) recordSessionDay();

    const t = (text || '').replace(/\s+/g, ' ').trim();
    if (t.length <= n) return t;
    return t.slice(0, n).trimEnd() + '…';

  // Insert phrase at cursor of given textarea, with surrounding whitespace cleanup
  function insertPhraseAt(textarea, phrase) {
    if (!textarea) return;
    const v = textarea.value;
    const start = textarea.selectionStart || 0;
    const end   = textarea.selectionEnd   || 0;
    const before = v.slice(0, start);
    const after  = v.slice(end);
    const needLeadSpace  = before.length > 0 && !/\s$/.test(before);
    const needTrailSpace = after.length > 0 && !/^\s/.test(after);
    const insert = (needLeadSpace ? ' ' : '') + phrase + (needTrailSpace ? ' ' : '');
    const next = before + insert + after;
    textarea.value = next;
    const newCursor = (before + insert).length;
    textarea.setSelectionRange(newCursor, newCursor);
    textarea.focus();
    textarea.classList.add('flash');
    setTimeout(() => textarea.classList.remove('flash'), 600);
  }

    neutrum:  { soft:'bg-green-50',  med:'bg-green-100',  border:'border-green-300',  text:'text-green-800',  accent:'bg-green-500' },

    if (!item || !item.case) return null;
    const c = item.case.toLowerCase();
    if (c.startsWith('nom')) return 'nominativ';
    if (c.startsWith('akk')) return 'akkusativ';
    if (c.startsWith('dat')) return 'dativ';
    if (c.startsWith('gen')) return 'genitiv';
    return null;

    if (!item) return null;
    if (item.gender === 'm') return 'maskulin';
    if (item.gender === 'n') return 'neutrum';
    if (item.gender === 'f') return 'feminin';
    if (item.gender === 'pl') return 'plural';
    return null;

  // Mini-cell snippet, used inside the Adjektiv-Endungen drill on wrong/hard answers
  function renderDeclMiniCell(item) {
    const c = declCase(item), g = declGender(item), patId = declPatternFor(item);
    const row = getDeclCellRow(c, g, patId);
    if (!row) return '';
    const pat = DECL_PATTERNS.find(p => p.id === patId);
    const tint = GENDER_TINTS[g];
    const labelMap = { def:'mit Artikel (Tab. 2)', zero:'ohne Artikel (Tab. 1)', ein:'mit ein/kein/poss.' };
    return `
      <div class="rounded-xl ${tint.soft} border-l-4 ${tint.border} border-y border-r border-neutral-200 px-3 py-2 mt-3 anim-hint">

  // ============================================================
  //  Vorlesen view
  // ============================================================
  let vorlesenTimerId = null, vorlesenStartedAt = 0;
  function buildVorlesenText() {
    const e = state.editor;
    if (!e) return '';
    if (e.area === 'schreiben') {
      return (e.title ? e.title + '\n\n' : '') + (e.body || '');
    }
    if (e.taskId === 'planning') {
      return (e.scenario ? 'Szenario: ' + e.scenario + '\n\n' : '') + (e.body || '');
    }
    // presentation
    const parts = [];
    if (e.topic) parts.push('Thema: ' + e.topic);
    PRES_SLIDE_TITLES.forEach((title, i) => {
      const body = e.slides[i] || '';
      if (body.trim()) parts.push(title + '\n' + body);
    });
    return parts.join('\n\n');
  }
  function ttsAvailable() {
    return typeof window !== 'undefined' && 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
  }
  function renderVorlesen() {
    const text = buildVorlesenText();
    const tts = ttsAvailable();
    return `
      <div class="fixed inset-0 z-40 bg-flag-ink text-white overflow-y-auto" data-action="close-vorlesen">
        <div class="sticky top-0 flex items-center gap-2 bg-flag-ink/90 backdrop-blur px-4 py-3 border-b border-white/10">
          <button data-action="close-vorlesen" class="rounded-full w-9 h-9 flex items-center justify-center bg-white/10 hover:bg-white/20">
            <span class="text-lg leading-none">×</span>
          </button>
          <div class="text-[11px] uppercase tracking-wider font-bold text-flag-gold">Vorlesen</div>
          <div id="vorlesen-timer" class="ml-auto font-mono tabular-nums text-base">0:00</div>
          ${tts ? `
            <button data-action="speak-all"
                    class="text-xs font-semibold rounded-full bg-flag-gold text-flag-ink px-3 py-1.5">🔊 Hör es</button>
            <button data-action="speak-stop"
                    class="text-xs font-semibold rounded-full bg-white/10 text-white px-3 py-1.5">Stop</button>` : ''}
        </div>
        <div class="px-6 py-10 cursor-pointer" data-action="close-vorlesen">
          <div class="vorlesen-text">${escapeHtml(text) || '<span class="opacity-60">(noch nichts geschrieben)</span>'}</div>
          <div class="text-center text-white/40 text-xs mt-12">tippen zum Beenden</div>
        </div>
      </div>
    `;
  }
  function startVorlesenTimer() {
    vorlesenStartedAt = Date.now();
    if (vorlesenTimerId) clearInterval(vorlesenTimerId);
    vorlesenTimerId = setInterval(() => {
      const sec = Math.floor((Date.now() - vorlesenStartedAt) / 1000);
      const m = Math.floor(sec / 60), s = sec % 60;
      const el = document.getElementById('vorlesen-timer');
      if (el) el.textContent = `${m}:${String(s).padStart(2,'0')}`;
    }, 1000);
  }
  function stopVorlesenTimer() {
    if (vorlesenTimerId) { clearInterval(vorlesenTimerId); vorlesenTimerId = null; }
    if (ttsAvailable()) { try { window.speechSynthesis.cancel(); } catch {} }
  }
  function speakText(text) {
    if (!ttsAvailable()) return;
    try {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      const voices = window.speechSynthesis.getVoices() || [];
      const de = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('de'));
      if (de) utter.voice = de;
      utter.lang = 'de-DE';
      utter.rate = 0.9;
      window.speechSynthesis.speak(utter);
    } catch {}
  }

  // ============================================================
  //  Export Vorlagen as Markdown
  // ============================================================
  function buildVorlagenMarkdown() {
    const s = loadState();
    let md = '# B1 Trainer — Vorlagen Export\n\n';
    md += `_Exported ${new Date().toLocaleString()}_\n\n`;
    SCHREIBEN_REDEMITTEL.forEach(t => {
      md += `## Schreiben · ${t.title}\n\n`;
      const list = (s.schreiben_vorlagen[t.id] || []);
      if (!list.length) { md += '_(keine Vorlagen)_\n\n'; return; }
      list.forEach(v => {
        md += `### ${v.name}${v.isExample ? ' _(Beispiel)_' : ''}\n\n${v.body}\n\n---\n\n`;
      });
    });
    SPRECHEN_REDEMITTEL.forEach(t => {
      md += `## Sprechen · ${t.title}\n\n`;
      const list = (s.sprechen_vorlagen[t.id] || []);
      if (!list.length) { md += '_(keine Vorlagen)_\n\n'; return; }
      list.forEach(v => {
        md += `### ${v.name}${v.isExample ? ' _(Beispiel)_' : ''}\n\n`;
        if (t.id === 'presentation' && v.slides && v.slides.length === 5) {
          if (v.topic) md += `**Thema:** ${v.topic}\n\n`;
          PRES_SLIDE_TITLES.forEach((title, i) => {
            md += `**${title}**\n\n${v.slides[i] || ''}\n\n`;
          });
        } else {
          md += `${v.body}\n\n`;
        }
        md += '---\n\n';
      });
    });
    return md;
  }
  function downloadFile(filename, content, type = 'text/markdown;charset=utf-8') {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  }

  // ============================================================
  //  Full progress export / import (JSON)
  // ============================================================
  function progressSummary(s) {
    const counts = {};
    ['vocab','nebensatz','habenSein','konjunktiv','adjective','praepLokal','verbPraep','modalPerfekt','relativ'].forEach(k => {
      counts[k] = Object.keys(s[k] || {}).length;
    });
    let vorlagen = 0;
    ['informal','formal','forum'].forEach(t => vorlagen += (s.schreiben_vorlagen && s.schreiben_vorlagen[t] || []).length);
    ['planning','presentation'].forEach(t => vorlagen += (s.sprechen_vorlagen && s.sprechen_vorlagen[t] || []).length);
    let drafts = 0;
    ['informal','formal','forum'].forEach(t => { if (s.schreiben_drafts && s.schreiben_drafts[t]) drafts++; });
    ['planning','presentation'].forEach(t => { if (s.sprechen_drafts && s.sprechen_drafts[t]) drafts++; });
    const items = Object.values(counts).reduce((a,b) => a+b, 0);
    return {
      itemsTracked: items,
      counts, vorlagen, drafts,
      streak: (s.meta && s.meta.streak) || 0,
      lastSessionDate: (s.meta && s.meta.lastSessionDate) || null,
    };
  }

  function exportProgress() {
    const s = loadState();
    const data = {
      __format: 'b1trainer-progress',
      __version: 1,
      __exportedAt: new Date().toISOString(),
      summary: progressSummary(s),
      state: s,
    };
    const stamp = new Date().toISOString().slice(0,10);
    downloadFile(`b1trainer-progress-${stamp}.json`, JSON.stringify(data, null, 2), 'application/json;charset=utf-8');
    showToast('Fortschritt exportiert');
  }

  function importProgressFromFile(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      let parsed;
      try { parsed = JSON.parse(e.target.result); }
      catch { showToast('Datei ist kein gültiges JSON'); return; }
      // Accept both wrapped {state: {...}} and bare-state shapes
      const incoming = (parsed && parsed.state && typeof parsed.state === 'object') ? parsed.state : parsed;
      if (!incoming || typeof incoming !== 'object') { showToast('Datei sieht nicht wie ein Backup aus'); return; }
      const expected = ['vocab','nebensatz','habenSein','konjunktiv','adjective','praepLokal','verbPraep','modalPerfekt','relativ','schreiben_vorlagen','sprechen_vorlagen','meta'];
      const hasExpected = expected.some(k => k in incoming);
      if (!hasExpected) { showToast('Backup unvollständig – Import abgebrochen'); return; }

      const summary = progressSummary({ ...emptyState(), ...incoming, meta: { ...emptyState().meta, ...(incoming.meta || {}) } });
      const msg = `Diese Datei ersetzt deinen aktuellen Fortschritt:

• ${summary.itemsTracked} verfolgte Karten
• ${summary.vorlagen} Vorlagen, ${summary.drafts} Entwürfe
• Streak: ${summary.streak}${summary.lastSessionDate ? ` (zuletzt ${summary.lastSessionDate})` : ''}

Fortfahren?`;
      if (!window.confirm(msg)) return;

      // Merge with fresh defaults so any new buckets added in newer versions stay sane
      const base = emptyState();
      const merged = { ...base, ...incoming };
      merged.meta = { ...base.meta, ...(incoming.meta || {}) };
      merged.ui_prefs = { ...base.ui_prefs, ...(incoming.ui_prefs || {}) };
      saveState(merged);
      // Drop any in-flight session/editor state — file shouldn't dictate UI
      state.session = null; state.editor = null; state.overlay = null; state.cardPhase = 'question'; state.feedback = null; state.draft = {};
      state.view = 'hub';
      showToast('Fortschritt importiert');
      render();
    };
    reader.readAsText(file);
  }

  function triggerImportPicker() {
    let input = document.getElementById('import-progress-input');
    if (!input) {
      input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json,application/json';
      input.id = 'import-progress-input';
      input.style.display = 'none';
      input.addEventListener('change', (ev) => {
        const f = ev.target.files && ev.target.files[0];
        if (f) importProgressFromFile(f);
        input.value = '';
      });
      document.body.appendChild(input);
    }
    input.click();
  }

  // ---- Slide-over overlay (rendered separately on top of view) ----
  function renderOverlay() {
    if (!state.overlay) return '';
    if (typeof state.overlay === 'object' && state.overlay.type === 'vorlagen') {
      return renderVorlagenOverlay();
    }
    let title = '', body = '';
    if (state.overlay === 'verb-position') {
      title = 'Verb-Position';
      body = renderVerbPositionRef({ overlay: true });
    } else if (state.overlay === 'article-patterns') {
      title = 'Artikel-Patterns';
      body = renderArticlePatternsRef({ overlay: true });
    } else if (state.overlay === 'declension') {
      title = 'Deklination';
      body = renderDeclensionRef({ overlay: true });
    } else {
      return '';
    }
    return `
      <div class="fixed inset-0 z-50 anim-bg-in">
        <div data-action="close-overlay" class="absolute inset-0 bg-black/40"></div>
        <aside class="absolute right-0 top-0 bottom-0 w-full sm:w-[28rem] lg:w-[34rem] bg-paper shadow-xl overflow-y-auto anim-slidein-right">
          <div class="sticky top-0 flex items-center justify-between bg-white border-b border-neutral-200 px-4 py-3">
            <div class="font-bold">${escapeHtml(title)}</div>
            <button data-action="close-overlay"
                    class="rounded-full w-8 h-8 flex items-center justify-center hover:bg-neutral-100">
              <span class="text-lg leading-none">×</span>
            </button>
          </div>
          <div class="px-4 py-4">${body}</div>
        </aside>
      </div>
    `;
  }

  // ============================================================
  //  Render
  // ============================================================
  function render() {
    const root = document.getElementById('app');
    const isEditor = state.view === 'schreiben-editor' || state.view === 'sprechen-editor';
    const isWideView = isEditor || state.view === 'reference-decl';
    root.className = (isWideView ? 'max-w-6xl' : 'max-w-2xl') + ' mx-auto px-4 pb-24';
    if (isSectionView(state.view)) recordLastSection(state.view);
    let main = '';
    if (state.view === 'dashboard' || state.view === 'hub') main = renderHub();
    else if (state.view === 'section-vokabeln')    main = renderSectionVokabeln();
    else if (state.view === 'section-grammatik')   main = renderSectionGrammatik();
    else if (state.view === 'section-editors')     main = renderSectionEditors();
    else if (state.view === 'section-referenz')    main = renderSectionReferenz();
    else if (state.view === 'reset-confirm')       main = renderResetConfirm();
    else if (state.view === 'habensein-mode')      main = renderHabenSeinModeSelect();
    else if (state.view === 'reference-verb')      main = renderVerbPositionRef();
    else if (state.view === 'reference-article')   main = renderArticlePatternsRef();
    else if (state.view === 'reference-decl')      main = renderDeclensionRef();
    else if (state.view === 'schreiben-home')      main = renderSchreibenHome();
    else if (state.view === 'sprechen-home')       main = renderSprechenHome();
    else if (state.view === 'schreiben-editor')    main = renderSchreibenEditor();
    else if (state.view === 'sprechen-editor') {
      const e = state.editor;
      main = (e && e.taskId === 'presentation') ? renderSprechenPresentationEditor() : renderSprechenPlanningEditor();
    }
    else if (state.view === 'vorlesen')            main = renderVorlesen();
    else if (state.view === 'session') {
      const s = state.session;
      if (!s) { state.view = 'hub'; render(); return; }
      if (s.type === 'habensein-blitz' && s.idx < s.cards.length && !s.blitz.ended) {
        main = renderHabenSeinBlitzCard(s.cards[s.idx]);
      } else {
        main = renderSession();
      }
    }
    else if (state.view === 'blitz-results') main = renderBlitzResults();
    root.innerHTML = main + renderOverlay();
    afterRender();
    if (state.view === 'vorlesen') startVorlesenTimer();
    else if (vorlesenTimerId) stopVorlesenTimer();
    state.navDir = null; // reset after render so subsequent renders default to forward
  }

  // boot
  migrate();
  seedSampleVorlagen();
  state.view = bootView();
  const required = [
    ['LESSONS', typeof LESSONS],
    ['NEBENSATZ_ITEMS', typeof NEBENSATZ_ITEMS],
    ['HABEN_SEIN_ITEMS', typeof HABEN_SEIN_ITEMS],
    ['KONJUNKTIV_ITEMS', typeof KONJUNKTIV_ITEMS],
    ['ADJECTIVE_ITEMS', typeof ADJECTIVE_ITEMS],
    ['PRAEPOSITION_LOKAL_ITEMS', typeof PRAEPOSITION_LOKAL_ITEMS],
    ['VERB_PRAEP_ITEMS', typeof VERB_PRAEP_ITEMS],
    ['MODAL_PERFEKT_ITEMS', typeof MODAL_PERFEKT_ITEMS],
    ['RELATIV_ITEMS', typeof RELATIV_ITEMS],
    ['VERB_POSITION_REFERENCE', typeof VERB_POSITION_REFERENCE],
    ['ARTICLE_PATTERNS_REFERENCE', typeof ARTICLE_PATTERNS_REFERENCE],
    ['DECLENSION_REFERENCE', typeof DECLENSION_REFERENCE],
    ['SCHREIBEN_REDEMITTEL', typeof SCHREIBEN_REDEMITTEL],
    ['SPRECHEN_REDEMITTEL', typeof SPRECHEN_REDEMITTEL],
  ];
  const missing = required.filter(([n, t]) => t === 'undefined').map(([n]) => n);
  if (missing.length) {
    document.getElementById('app').innerHTML =
      `<div class="text-red-700 p-6 font-semibold">Data files failed to load: <code>${missing.join(', ')}</code>. Make sure all *_data.js files are next to index.html and the page is served (not opened via file://).</div>`;
  } else {
    render();
  }
  </script>
</body>
</html>
